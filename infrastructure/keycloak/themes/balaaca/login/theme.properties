# Balaaca - the sign-in screens.
#
# parent=base, not keycloak: the shipped theme is PatternFly, and inheriting it
# means loading a framework in order to override it. base carries the templates
# and no styling at all, so every class below is ours and the page ships one
# stylesheet.
#
# The consequence, and it is the reason this file is long: base's templates
# read their class names from these properties. A property left unset renders
# as an empty class attribute, which is harmless but unstyled - so anything a
# screen we use touches is named here.
parent=base
import=common/keycloak

styles=css/balaaca.css

# base wraps most things in a div and asks this file what to call it. Several
# map to nothing on purpose: the markup we want is flatter than PatternFly's,
# and an empty value removes the class rather than inventing one.
kcHtmlClass=bal-html
kcBodyClass=bal-body
kcLoginClass=bal
kcContentWrapperClass=
kcHeaderClass=
kcHeaderWrapperClass=
kcFormCardClass=bal__card
kcFormHeaderClass=
kcContentClass=

kcFormClass=bal__form
kcFormGroupClass=bal__field
kcFormGroupErrorClass=bal__field--error
kcLabelClass=bal__label
kcLabelWrapperClass=
kcInputClass=bal__input
kcInputWrapperClass=
kcInputErrorMessageClass=bal__error
kcInputHelperTextAfterClass=bal__hint

kcFormOptionsClass=
kcFormOptionsWrapperClass=
kcFormButtonsClass=
kcFormSettingClass=

kcButtonClass=bal__btn
kcButtonPrimaryClass=
kcButtonDefaultClass=bal__btn--quiet
kcButtonSecondaryClass=bal__btn--quiet
kcButtonLargeClass=
kcButtonBlockClass=

kcCheckboxInputClass=
kcCheckboxLabelClass=bal__check

kcFeedbackAreaClass=
kcFeedbackInfoIcon=
kcFeedbackSuccessIcon=
kcFeedbackWarningIcon=
kcFeedbackErrorIcon=

kcResetFlowIcon=
kcFormSocialAccountListClass=
kcInfoAreaClass=

# One language. The realm declares fr as its default and its only supported
# locale, so the picker never renders - but the templates still ask.
locales=fr
