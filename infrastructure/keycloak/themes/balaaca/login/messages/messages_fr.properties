# Balaaca - the words on the sign-in screens.
#
# Keycloak ships a full French catalogue and it is inherited, so this file
# holds ONLY what the product says differently. Every line here is a sentence
# the default gets right grammatically and wrong for this product: a provider
# in Conakry is opening their own shop's diary, not "an account on a service".
#
# Anything not listed falls back to Keycloak's own French.

