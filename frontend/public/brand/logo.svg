<!--
  Le logo de Balaaca, sur fond clair.

  Ce fichier est un EMPLACEMENT, pas une décision : c'est la marque proposée
  par l'outil de maquette, reprise telle quelle pour que rien ne soit vide.
  Remplacez-le par le vôtre et rien d'autre ne bouge — aucun code ne le nomme
  autrement que par ce chemin.

  Ce qu'il doit supporter : il est rendu à 26 px de côté dans l'en-tête et se
  vise au pouce. Un carré ou un cercle tient ; un logo large avec le nom dedans
  demande de retirer le mot « Balaaca » à côté, ce qui est une ligne à changer
  dans src/components/ui.tsx.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <rect width="24" height="24" rx="7" fill="#123C35"/>
  <path d="M7.6 18.6V11.9a4.4 4.4 0 0 1 8.8 0v6.7M4.8 18.6h14.4"
        fill="none" stroke="#C9A86A" stroke-width="1.9" stroke-linecap="round"/>
</svg>
