# Balaaca continuous integration.
#
# Every job here checks something that exists TODAY. Jobs for the Maven build,
# the test levels, the coverage and mutation gates and the container image are
# added with the code they verify: a job that cannot fail is not a gate, and
# leaving one in place would make the pipeline read greener than it is.
#
# Every action is pinned to a commit SHA, never a tag. A tag is mutable and its
# owner can silently repoint it, which is exactly how the tj-actions/changed-files
# and reviewdog supply-chain compromises worked.

name: ci

on:
  pull_request:
    # develop is the integration branch; main only ever receives a promotion,
    # and that promotion must pass the same gate it would have on develop.
    branches: [develop, main]
  push:
    branches: [develop, main]

# Least privilege: no job here writes anything.
permissions:
  contents: read

# A superseded run is wasted money and a misleading status.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks walks history: a secret removed in a later commit is still
          # compromised and must still fail the build.
          fetch-depth: 0

      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # Pinned like an action: the release archive is verified before it is
          # executed. The MIT binary is used rather than the marketplace action,
          # which bills organisation accounts.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks --version
          # --redact so a finding never prints the secret into a public log.
          ./gitleaks detect --source . --redact --exit-code 1 --verbose

  build:
    name: build and test
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify, not test: the integration suites are *IT under Failsafe and run
      # against a real PostgreSQL through Testcontainers. The runner supplies the
      # Docker socket they need - and finds it instantly, unlike Docker Desktop
      # on macOS, where socket discovery is slow enough to look like a hang.
      #
      # Swapping them for an in-memory database would delete the only proof that
      # RLS, the exclusion constraint and the deadlock retry behave: none of the
      # three exists outside PostgreSQL.
      - run: mvn -B -f backend/pom.xml verify

      # The satellite is its own Maven project, outside the backend reactor on
      # purpose, so the verify above does not reach it. Its suites need the same
      # PostgreSQL: they run the real migrations against a container and drain
      # under the worker's own least-privilege role.
      - run: mvn -B -f notification-worker/pom.xml verify

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            backend/**/target/surefire-reports/**
            backend/**/target/failsafe-reports/**
            notification-worker/target/surefire-reports/**
            notification-worker/target/failsafe-reports/**
          if-no-files-found: ignore

  frontend:
    name: frontend
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: it installs exactly the lockfile and fails if
      # package.json and the lock disagree, which is the only way a pinned tree
      # stays pinned.
      - run: npm ci
        working-directory: frontend

      # typecheck regenerates the API types from META-INF/openapi.yaml first,
      # so this is also the drift check: the contract is the source, nothing is
      # committed from it, and a page reading a field the document no longer
      # publishes stops compiling here.
      - run: npm run typecheck
        working-directory: frontend

      - run: npm run test
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

      # The build is what proves every page actually renders on the server -
      # a bad import or a client hook in a server component fails here and
      # nowhere earlier.
      - run: npm run build
        working-directory: frontend

  contract:
    name: published contract
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      # Full history: the breaking-change check needs the version of the
      # document that is already on develop to compare against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The document is what is published, so it is what is linted - not the
      # code that implements it and not the runtime /q/openapi, which is served
      # from this same file with annotation scanning off.
      # npm ci, not npx. Every other tool in this workflow is pinned to a SHA or
      # a checksum, with a comment saying why; `npx --yes` resolved and executed
      # spectral's entire transitive tree from the registry on every run, with no
      # lockfile and no integrity check. package-lock.json pins all 247 packages
      # by integrity hash, and `npm ci` refuses to install anything else.
      - name: Lint the OpenAPI document
        run: |
          npm ci --ignore-scripts
          npm run lint:openapi

      # A pinned, checksummed binary, like gitleaks and osv-scanner above: an
      # action that resolves a tag at run time decides what runs in this gate.
      - name: Check for breaking changes
        env:
          OASDIFF_VERSION: 1.29.1
          OASDIFF_SHA256: 541f7c66c933495fceef24eaf5c48aa66c19069f366f7bd0a60a6a4820c5e533
        run: |
          set -uo pipefail
          spec=backend/app/src/main/resources/META-INF/openapi.yaml

          # Nothing to compare against the first time the document appears, and
          # that is not a failure - it is the base case.
          if ! git show "origin/${{ github.base_ref || 'develop' }}:$spec" > /tmp/published.yaml 2>/dev/null; then
            echo "::notice::no published contract to compare against yet"
            exit 0
          fi

          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "$archive" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/${archive}"
          echo "${OASDIFF_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" oasdiff

          # Additive changes pass. Removing a field, tightening a type, renaming
          # an error code or making an optional parameter required does not:
          # inside /v1 the promise is compatibility, and breaking it needs /v2.
          # --err-ignore, not a relaxed --fail-on: the waivers are named, dated
          # and quoted in .oasdiff-ignore, and each one is as narrow as the
          # sentence it quotes. Lowering the threshold instead would waive every
          # future breaking change along with the one being accepted today.
          ./oasdiff breaking /tmp/published.yaml "$spec" \
            --fail-on ERR --err-ignore .oasdiff-ignore

  lint:
    name: shell and compose
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shellcheck the hooks and the bootstrap
        run: |
          set -euo pipefail
          # shellcheck ships on the runner image, so there is nothing to pin.
          shellcheck --version
          shellcheck --severity=warning \
            infrastructure/postgres/bootstrap.sh \
            infrastructure/keycloak/smoke.sh \
            scripts/dev.sh scripts/dev-stop.sh \
            scripts/generate-env.sh scripts/deploy.sh
          # The entrypoint is POSIX sh: the Keycloak image has no bash.
          shellcheck --shell=sh --severity=warning \
            infrastructure/keycloak/init-realm.sh
          # The hooks are POSIX sh, not bash: check them as such.
          shellcheck --shell=sh --severity=warning \
            .githooks/commit-msg .githooks/pre-push .githooks/pre-commit

      - name: Validate the compose stack
        run: |
          set -euo pipefail
          cp .env.example .env
          # Two failures matter here. A malformed compose file, and a variable
          # referenced by compose but absent from .env.example - which breaks a
          # fresh clone silently, since compose only warns and substitutes "".
          warnings=$(docker compose config 2>&1 >/dev/null || true)
          if printf '%s' "$warnings" | grep -q 'variable is not set'; then
            echo "::error::a compose variable is missing from .env.example"
            printf '%s\n' "$warnings"
            exit 1
          fi
          docker compose config --quiet

      - name: Check the commit-msg hook still enforces the convention
        run: |
          set -euo pipefail
          # The hook is the only thing enforcing the commit convention, since
          # this repository has no server-side branch protection. If it stops
          # working, nothing else notices.
          tmp=$(mktemp -d)
          check() {
            printf '%s' "$2" > "$tmp/msg"
            if .githooks/commit-msg "$tmp/msg" >/dev/null 2>&1; then r=ACCEPT; else r=REJECT; fi
            if [ "$r" != "$1" ]; then
              echo "::error::commit-msg hook: expected $1 for '$3'"
              exit 1
            fi
            echo "ok $r  $3"
          }
          check ACCEPT 'Add provider ownership guard'        'plain imperative'
          check REJECT 'Added provider ownership guard'      'past tense'
          check REJECT 'feat(booking): add guard'            'conventional prefix'
          check REJECT 'add provider ownership guard'        'lowercase start'
          check REJECT 'Add provider ownership guard.'       'trailing period'
          check REJECT 'Add a provider ownership guard to the booking module' 'over 50 chars'
          check REJECT "$(printf 'Add guard\n\nCo-Authored-By: X <a@b.c>')" 'co-author trailer'

  dependencies:
    name: vulnerable dependencies
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Scanning the poms directly sees nothing here, and says so only if you
      # read stderr: OSV resolves through the registry, every backend module
      # depends on sibling com.balaaca artifacts, and no SNAPSHOT of this
      # project is in Central. Resolution aborts on the first missing sibling
      # and drops the whole tree, so a module with 52 known vulnerabilities
      # reported zero. Only notification-worker was ever resolved, because it
      # depends on no Balaaca artifact.
      #
      # An SBOM is what Maven itself resolved, so there is nothing left to look
      # up. makeAggregateBom covers every module in the reactor.
      - name: Build the SBOMs
        run: |
          mvn -B -f backend/pom.xml -DskipTests \
            org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom -DoutputFormat=json
          mvn -B -f notification-worker/pom.xml -DskipTests \
            org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom -DoutputFormat=json

      # Keyless by design. OWASP Dependency-Check throttles to a multi-minute
      # NVD warm-up without an API key and its recent releases fail outright
      # when one is absent, which is a gate that fails for the wrong reason.
      #
      # Run as a pinned binary rather than through the action, because the exit
      # code needs handling the action does not expose: osv-scanner returns 127
      # when every finding matched a documented waiver, which is a pass, not a
      # failure. Pinned and checksummed like the gitleaks archive above.
      - name: Run OSV-Scanner
        env:
          OSV_VERSION: 2.5.1
          OSV_SHA256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be
        run: |
          set -uo pipefail
          curl -sSfL --retry 3 -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner

          # --allow-no-lockfiles: a directory with no manifest is not a finding.
          # --config: waivers live in osv-scanner.toml, each with a reason and an
          # expiry, and the scanner prints the reason it filtered on.
          # `|| code=$?` and not a bare call: an Actions run step already
          # executes under `bash -e`, so a non-zero exit aborts the step before
          # the case below is ever reached.
          # The recursive pass still runs: it covers every ecosystem that is
          # not Maven, and it is what the plexus-utils waiver is written
          # against. The two SBOMs are what actually covers the Java trees.
          scan() {
            code=0
            ./osv-scanner --config=osv-scanner.toml "$@" || code=$?
            case "$code" in
              0)   echo "no known vulnerabilities in $*" ;;
              127) echo "::notice::every finding in $* matched a waiver" ;;
              *)   echo "::error::osv-scanner failed with exit $code on $*"; exit "$code" ;;
            esac
          }

          scan --recursive --allow-no-lockfiles ./
          scan --sbom=backend/target/bom.json
          scan --sbom=notification-worker/target/bom.json

  images:
    name: container images
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nothing built these until they were pushed by hand, and the header of
      # this file said as much: the container-image job was to arrive "with the
      # code it verifies". It did not. All three shipped with a healthcheck
      # aimed at the management port - 404 on every poll, both Java containers
      # permanently unhealthy, and `web` in docker-compose.prod.yml waiting on
      # `api: condition: service_healthy` for a condition that could not come.
      #
      # Plain `docker build`, no actions: buildx is already on the runner, and
      # every action added here is another SHA to pin and another supply chain
      # to trust for something two lines of shell already do.
      #
      # linux/amd64 and not arm64, deliberately. What this job checks is that
      # the recipes still build; the artefact is thrown away. Cross-building
      # arm64 means QEMU, which means a Maven reactor under emulation and a job
      # measured in tens of minutes to prove what a native build proves in
      # three. The image that SHIPS is built on the machine that deploys it -
      # see docs/DEPLOYMENT.md.
      - name: Build the three images
        run: |
          set -euo pipefail
          for image in api worker web; do
            echo "::group::$image"
            docker build -f "docker/$image.Dockerfile" -t "balaaca-$image:ci" .
            echo "::endgroup::"
          done

      # A built image is not a working one, and that distinction is the whole
      # reason this job exists. Booting the API needs PostgreSQL with its five
      # roles and a Keycloak realm, which is a bigger job than this one and is
      # worth writing; until it is, this at least proves each image has an
      # entrypoint that starts and a JVM that finds its jar - the API refuses at
      # the database it cannot reach, which means it got that far.
      - name: Each image starts far enough to name what it is missing
        run: |
          set -euo pipefail
          for image in api worker; do
            echo "::group::$image"
            # It cannot reach a database, so it must FAIL - but it must fail
            # having started the JVM and read its configuration, not on a
            # missing class or an unreadable jar.
            docker run --rm --name "smoke-$image" "balaaca-$image:ci" \
              > "$image.log" 2>&1 || true
            if ! grep -q "Quarkus\|quarkus" "$image.log"; then
              echo "::error::balaaca-$image never reached Quarkus - the jar or the entrypoint is wrong"
              tail -30 "$image.log"
              exit 1
            fi
            echo "$image: the runtime started"
            echo "::endgroup::"
          done
