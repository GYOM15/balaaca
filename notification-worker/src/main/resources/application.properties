quarkus.application.name=balaaca-notification-worker
quarkus.http.port=${NOTIFICATION_WORKER_PORT:8090}

# --- Datasource -------------------------------------------------------------
# balaaca_notification_worker: no BYPASSRLS, owns no table, and is granted
# SELECT and UPDATE on notifications and nothing else. Its own RLS policy is
# what lets it see every provider's rows, which is a decision written in SQL
# rather than a privilege the role carries around.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=balaaca_notification_worker
quarkus.datasource.password=${BALAACA_DB_WORKER_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_HOST_PORT:55432}/${POSTGRES_DB:balaaca}
# A drain loop is one connection at a time plus the reaper. Sizing it like the
# API would hold idle connections the API could have used.
quarkus.datasource.jdbc.max-size=4

# --- Schema -----------------------------------------------------------------
# No Flyway here. The worker owns no schema and must not be able to alter the
# one table it reads; migrations belong to the application deployable alone.

# --- Channel ----------------------------------------------------------------
# Deliberately unset. There is no default because the only channel that exists
# today delivers nothing, and a worker that silently marks rows SENT is worse
# than one that refuses to start. Set it explicitly, per environment.
#
#   balaaca.notification.channel=console     writes to the log, delivers nothing
#   balaaca.notification.channel=whatsapp    the WhatsApp Business Platform
#
# The WhatsApp adapter is written against the published Graph API contract, so
# the only thing an account changes is the base URL and the credentials. Until
# there is one, point base-url at a stub that speaks the same protocol and the
# whole path - outbox, claim, send, acknowledge, retry - runs for real.

# --- WhatsApp ---------------------------------------------------------------
balaaca.whatsapp.base-url=${WHATSAPP_BASE_URL:https://graph.facebook.com}
balaaca.whatsapp.api-version=${WHATSAPP_API_VERSION:v21.0}
# No defaults: a worker configured for WhatsApp with no number and no token
# would claim rows, fail every send, and walk the whole backlog to DEAD.
balaaca.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
balaaca.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}

# --- Observability ----------------------------------------------------------
quarkus.log.console.json=true

# --- Metrics ------------------------------------------------------------------
# Same arrangement as the API: metrics on a management interface, on their own
# port, and health pinned back to the application port so that a healthcheck or a
# readiness wait does not start failing for a reason that names nothing.
#
# What this target is FOR is `up`. The queue itself is measured from PostgreSQL
# rather than from here, because a gauge this process publishes goes silent at
# the exact moment it matters: see infrastructure/observability/README.md.
quarkus.management.enabled=true
quarkus.management.port=${NOTIFICATION_WORKER_MANAGEMENT_PORT:9100}
# 0.0.0.0 for the same reason as the API, and the port must be closed at the
# host firewall for the same reason too.
quarkus.management.host=${NOTIFICATION_WORKER_MANAGEMENT_HOST:0.0.0.0}
quarkus.smallrye-health.management.enabled=false

quarkus.micrometer.binder.netty.enabled=false
quarkus.micrometer.binder.kafka.enabled=false
quarkus.micrometer.binder.messaging.enabled=false
quarkus.micrometer.binder.grpc-server.enabled=false
quarkus.micrometer.binder.grpc-client.enabled=false
quarkus.micrometer.binder.stork.enabled=false

# Not 9001. That is what the application's own suite binds, and the two reactors
# have already been built side by side on this machine.
%test.quarkus.management.test-port=9101

%dev.quarkus.log.console.json=false
%dev.balaaca.notification.channel=console
%test.balaaca.notification.channel=console
# The scheduler is off, not merely slowed. A 24-hour interval was what stood
# here, and it does not stop the FIRST execution: Quarkus runs an `every` job
# once at startup. So the drain fired in the middle of a test, claimed a row the
# test had just released, sent it, and the assertion read SENT where it expected
# PENDING - once in six runs, which is exactly often enough to look like
# something else.
%test.quarkus.scheduler.enabled=false
%test.balaaca.notification.drain-interval=24h
%test.balaaca.notification.reap-interval=24h

# Where an alert goes. `log` is the default and is what the worker always did,
# so nothing is silently lost by leaving it - and switching to `webhook` makes
# the same events arrive on a telephone. Any endpoint that accepts a POST with a
# JSON body works: a Telegram bot, a Discord hook, an ntfy topic, a Slack hook.
balaaca.alerts.channel=${BALAACA_ALERTS_CHANNEL:log}
balaaca.alerts.webhook-url=${BALAACA_ALERTS_WEBHOOK_URL:}
# One alert per kind per window. A channel outage produces one dead row per
# message, and a destination that receives four hundred of them is a destination
# somebody mutes - after which nothing is alerting at all.
balaaca.alerts.window-minutes=${BALAACA_ALERTS_WINDOW_MINUTES:15}
