quarkus.application.name=balaaca
quarkus.http.port=${BACKEND_PORT:8080}

# --- Datasource -------------------------------------------------------------
# The application connects as balaaca_app: not the table owner, no BYPASSRLS.
# Connecting as the owner or the superuser would make every RLS policy inert
# while every test still passed.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${BALAACA_DB_APP_USER:balaaca_app}
quarkus.datasource.password=${BALAACA_DB_APP_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_HOST_PORT:55432}/${POSTGRES_DB:balaaca}
quarkus.datasource.jdbc.max-size=16

# --- Flyway -----------------------------------------------------------------
# Migrations run as balaaca_migrator, which owns the schema. Two roles, because
# the application must not be able to alter the tables it is constrained by.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.username=${BALAACA_DB_MIGRATOR_USER:balaaca_migrator}
quarkus.flyway.password=${BALAACA_DB_MIGRATOR_PASSWORD}
quarkus.flyway.clean-disabled=true
quarkus.flyway.validate-on-migrate=true

# --- Hibernate --------------------------------------------------------------
# The schema comes from Flyway alone. Letting Hibernate generate it would put a
# second, unreviewed source of truth next to the migrations.
quarkus.hibernate-orm.schema-management.strategy=none

# --- Redis ------------------------------------------------------------------
quarkus.redis.hosts=redis://${REDIS_HOST:localhost}:${REDIS_HOST_PORT:56379}
quarkus.redis.password=${REDIS_PASSWORD}

# --- Identity ---------------------------------------------------------------
# Off until the realm exists. Deliberately explicit rather than half-configured:
# a wrong issuer fails at startup, and a silently permissive one is worse.
quarkus.oidc.enabled=false

# --- Observability ----------------------------------------------------------
quarkus.log.console.json=true
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=false

# --- Errors -----------------------------------------------------------------
# No stack trace, no SQL, no constraint name ever reaches a client.
quarkus.rest.exception-mapper.print-details=false

%dev.quarkus.log.console.json=false
%test.quarkus.flyway.migrate-at-start=true
