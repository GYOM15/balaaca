quarkus.application.name=balaaca
quarkus.http.port=${BACKEND_PORT:8080}

# --- Datasource -------------------------------------------------------------
# The application connects as balaaca_app: not the table owner, no BYPASSRLS.
# Connecting as the owner or the superuser would make every RLS policy inert
# while every test still passed.
quarkus.datasource.db-kind=postgresql
# Fixed, not configurable: the migrations grant to this literal name.
quarkus.datasource.username=balaaca_app
quarkus.datasource.password=${BALAACA_DB_APP_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_HOST_PORT:55432}/${POSTGRES_DB:balaaca}
quarkus.datasource.jdbc.max-size=16

# --- Flyway -----------------------------------------------------------------
# Migrations run as balaaca_migrator, which owns the schema. Two roles, because
# the application must not be able to alter the tables it is constrained by.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.username=balaaca_migrator
quarkus.flyway.password=${BALAACA_DB_MIGRATOR_PASSWORD}
quarkus.flyway.clean-disabled=true
quarkus.flyway.validate-on-migrate=true

# --- Hibernate --------------------------------------------------------------
# The schema comes from Flyway alone. Letting Hibernate generate it would put a
# second, unreviewed source of truth next to the migrations.
quarkus.hibernate-orm.schema-management.strategy=none

# --- Redis ------------------------------------------------------------------
quarkus.redis.hosts=redis://${REDIS_HOST:localhost}:${REDIS_HOST_PORT:56379}
quarkus.redis.password=${REDIS_PASSWORD}

# --- Identity ---------------------------------------------------------------
# The realm is a committed file, imported by compose. KEYCLOAK_ISSUER_URL has no
# default on purpose: an application that starts without an issuer is an
# application whose authenticated routes fail for a reason nobody looks for.
# Absent, it fails at startup and says so.
quarkus.oidc.auth-server-url=${KEYCLOAK_ISSUER_URL}
quarkus.oidc.client-id=${KEYCLOAK_BACKEND_CLIENT_ID:balaaca-backend}
# A resource server: it validates bearer tokens and redirects nobody.
quarkus.oidc.application-type=service

# A token minted for another client is not a token for this API. Without this
# check any token this realm ever issued - to the chatbot, to a partner, to
# something not yet built - would open the dashboard.
quarkus.oidc.token.audience=${KEYCLOAK_BACKEND_CLIENT_ID:balaaca-backend}

# The scopes the contract declares become roles, so @RolesAllowed enforces what
# the OpenAPI document promises instead of describing it. The claim is a single
# space-separated string, hence the separator.
quarkus.oidc.roles.role-claim-path=scope
quarkus.oidc.roles.role-claim-separator= 

# Tests mint their own identity: what they exercise is what the database does
# with a subject, not that a provider can sign. Running a Keycloak per test
# class would prove the same thing far more slowly.
%test.quarkus.oidc.enabled=false

# --- Observability ----------------------------------------------------------
quarkus.log.console.json=true
quarkus.smallrye-openapi.path=/q/openapi

# --- Metrics ------------------------------------------------------------------
# Micrometer publishes on the MANAGEMENT interface, on its own port. /v1 is
# public and /q/metrics is not: an unauthenticated metrics endpoint served beside
# the API means nginx has to remember to refuse a path, rather than simply not
# forwarding a port.
#
# Enabling the management interface MOVES the non-application endpoints onto it,
# and two of them must not move. Measured, not assumed: with only
# quarkus.management.enabled set, :8080/q/health/ready and :8080/q/openapi both
# answered 404 and both had appeared on :9000. scripts/dev.sh, the CI smoke boot
# and every future container healthcheck poll the first, and the published
# document lives at the second. An absolute path does not exempt either of them:
# it is resolved against whichever root path the endpoint ended up on.
quarkus.management.enabled=true
quarkus.management.port=${BACKEND_MANAGEMENT_PORT:9000}
# 0.0.0.0, and the reason is not laziness. Prometheus runs in a container while
# this runs as a jar on the host, so on Linux it arrives through the docker
# bridge gateway, which a socket bound to 127.0.0.1 does not answer. The port is
# therefore closed at the FIREWALL rather than at the bind address. Set
# BACKEND_MANAGEMENT_HOST=127.0.0.1 wherever Prometheus is not in a container.
quarkus.management.host=${BACKEND_MANAGEMENT_HOST:0.0.0.0}
quarkus.smallrye-health.management.enabled=false
quarkus.smallrye-openapi.management.enabled=false

# Load-bearing, and a default. When true, a 4xx loses its uri tag, and the whole
# "bookings refused, by reason" panel silently becomes one undifferentiated line:
# every refusal this product cares about IS a 4xx. Written down so that turning
# it on is a decision rather than an accident.
quarkus.micrometer.binder.http-server.suppress4xx-errors=false

# What is measured is deliberately not everything. These binders describe
# transports this application does not use, and each one that is on publishes
# series nobody will ever open.
quarkus.micrometer.binder.netty.enabled=false
quarkus.micrometer.binder.kafka.enabled=false
quarkus.micrometer.binder.messaging.enabled=false
quarkus.micrometer.binder.grpc-server.enabled=false
quarkus.micrometer.binder.grpc-client.enabled=false
quarkus.micrometer.binder.stork.enabled=false

# Tests keep the management interface, so that what they exercise is the
# arrangement that ships. The port is pinned rather than left at its default,
# because notification-worker's suite would otherwise want the same one.
%test.quarkus.management.test-port=9001
# The published surface is META-INF/openapi.yaml, not whatever the classpath
# happens to hold. With scanning on, a new resource would quietly append itself
# to the document and a client would discover an operation nobody reviewed.
mp.openapi.scan.disable=true
quarkus.swagger-ui.always-include=false

# The wire is snake_case throughout, including the pagination envelope.
quarkus.jackson.property-naming-strategy=SNAKE_CASE

# --- Errors -----------------------------------------------------------------
# Nothing configured here on purpose. quarkus.rest.exception-mapper.print-details
# used to sit at this spot and no Quarkus extension has ever declared it: it
# warned on every boot and did nothing. What actually holds the guarantee is
# UnexpectedExceptionMapper, a catch-all that logs the cause with a trace id and
# returns the id alone - so no stack trace, no SQL and no constraint name can
# reach a client through any path, handled or not.

%dev.quarkus.log.console.json=false
%test.quarkus.flyway.migrate-at-start=true

# --- Coverage ---------------------------------------------------------------
# The extension, not the bare agent: Quarkus rewrites classes during
# augmentation, so an exec file recorded at runtime carries class ids that no
# longer match the .class files on disk. A plain jacoco:report-aggregate reads
# every adapter as 0% covered while the integration suites drive them on every
# request. This one knows what it transformed.
%test.quarkus.jacoco.includes=com/balaaca/**
# Generated from the contract, so its getters, equals and toString are the
# generator's work and not ours. Counting them moves the ratio without telling
# anyone anything: the first version of this gate read 50% purely because the
# wire types had appeared, and a threshold answering to that is a threshold
# measuring the wrong thing.
%test.quarkus.jacoco.excludes=com/balaaca/app/api/**
%test.quarkus.jacoco.report-location=target/site/jacoco-aggregate
%test.quarkus.jacoco.data-file=target/jacoco-quarkus.exec

# --- Media ------------------------------------------------------------------
# Where published images live. A mounted directory today, and deliberately a
# port behind it: one instance serving its own bytes does not survive a second
# instance, and images belong behind a CDN. Moving them there changes one
# adapter, not the schema - the database holds a NAME, never a URL.
balaaca.media.root=${BALAACA_MEDIA_ROOT:/var/lib/balaaca/media}
%dev.balaaca.media.root=${BALAACA_MEDIA_ROOT:target/media}
%test.balaaca.media.root=target/media-test

# Where a customer reaches a provider's page. It is the address printed on the
# QR code, so a wrong value here is a wrong value on somebody's shopfront - the
# one setting in this file whose mistakes leave the building.
balaaca.public.base-url=${BALAACA_PUBLIC_BASE_URL:http://localhost:3000}

# --- The clock the tests read -----------------------------------------------
# Empty in every profile but %test. See ClockProducer for why: the integration
# suite books at fixed dates chosen for their day of week, so against the real
# clock it had an expiry date - and reached it on 2026-09-02, when every test
# booking 2026-09-01 began answering 422 because the slot was in the past.
#
# 2026-08-31 is a Monday, which puts every date the suite uses in the future
# and inside the fixtures' opening days. Move it only with the suite in hand.
balaaca.clock.pinned-to=
%test.balaaca.clock.pinned-to=2026-08-31T08:00:00Z
