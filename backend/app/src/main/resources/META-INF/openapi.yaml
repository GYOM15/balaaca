openapi: 3.0.3

# The published contract. One document, hand-authored, in the deployable that
# assembles the contexts - never one per Maven module: every module's
# META-INF/openapi.yaml lands at the same classpath path, SmallRye serves
# whichever wins the scan, and the rest disappear at runtime with no error.
#
# Runtime annotation scanning is off (mp.openapi.scan.disable), so what is
# served is this file and only this file. The server interfaces and the wire
# types are generated from it into target/generated-sources and never
# committed: the only way to change the interface is to change the contract,
# and the compiler catches a resource that no longer matches.
info:
  title: Balaaca API
  version: "1.0.0"
  description: |
    The surface a client can call: today the two public operations a customer
    reaches from a provider's page. Provider-scoped operations arrive with
    authentication and will carry OAuth2 scopes; they will carry no tenant
    identifier, because the tenant is resolved server-side from the verified
    subject.

    Every property and query parameter is snake_case. Instants are UTC
    date-times. Money is `{ amount_minor, currency }`, never a bare number.
  contact:
    name: Balaaca
    url: https://github.com/GYOM15/balaaca
  license:
    name: PolyForm Noncommercial 1.0.0
    url: https://polyformproject.org/licenses/noncommercial/1.0.0/

servers:
  # Relative on purpose: no public hostname is published yet, and inventing one
  # would put a URL in the contract that resolves to nothing.
  - url: /
    description: The deployable serving this document.

tags:
  - name: providers
    description: |
      The provider collection: finding a business, and becoming one. One tag
      because one path - every operation on `/v1/providers` is generated into
      the same interface and served by the same class, and splitting them
      across tags produces two classes for one path, of which the router keeps
      one and answers 405 to the other.
  - name: profile
    description: What a provider publishes about itself.
  - name: discovery
    description: What a customer sees before booking.
  - name: team
    description: The people who work at a provider.
  - name: invitations
    description: Joining a team you were invited to.
  - name: schedule
    description: When a provider is open, and when they are not.
  - name: catalogue
    description: The services a provider offers.
  - name: moderation
    description: |
      The platform's own hand: taking a business off the hub, putting it back,
      and reading what customers reported. The only surface that crosses
      providers, held by the operator alone.
  - name: clientele
    description: The people a provider has served, and what they know about them.
  - name: agenda
    description: What a provider sees of their own bookings.
  - name: availability
    description: What a customer can book, from a provider's public page.
  - name: booking
    description: Taking a slot.

paths:
  /v1/appointments:
    get:
      operationId: listAppointments
      tags: [agenda]
      summary: List the caller's own appointments
      description: |
        The provider's agenda. There is no provider identifier anywhere in this
        request - not a path segment, not a query parameter, not a header. The
        tenant is resolved server-side from the verified subject through `users`
        and `provider_staff`, so a scope grants access inside the caller's own
        provider and can never reach across.

        A subject that resolves to no active membership is `403 FORBIDDEN`. That
        is not the same as `401`: the token was valid, it simply belongs to
        nobody here.
      security:
        - oauth2: [dashboard:read]
      parameters:
        - name: from
          in: query
          required: false
          description: Only appointments starting at or after this instant.
            Defaults to now.
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          required: false
          description: Narrow to one status. Omit for the active ones -
            `PENDING` and `CONFIRMED`.
          schema:
            $ref: '#/components/schemas/AppointmentStatus'
        - name: to
          in: query
          required: false
          description: |
            Latest start to return. Without it the agenda is a ray - "show me
            Saturday" pages into next month - so a day or a week view has to
            read pages it will throw away.
          schema:
            type: string
            format: date-time
        - name: staff_id
          in: query
          required: false
          description: |
            One person's appointments. Omit for the whole business.

            The agenda used to return an undifferentiated stream: `staff_id` is
            NOT NULL on every appointment and is the resource key of the
            constraint that stops double booking, and it was neither returned
            nor filterable - so a salon with five chairs could not draw a column
            per chair, nor label a row.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The caller's appointments, earliest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: '`UNAUTHENTICATED` - no verified token, or it expired.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: '`FORBIDDEN` - the subject belongs to no active provider.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    post:
      operationId: bookWalkIn
      tags: [agenda]
      summary: Write an appointment straight into the diary
      description: |
        The counter, not the public page. Somebody is standing in the salon, or
        on the telephone, and the provider is writing them into the book.

        It differs from the public booking route in exactly one way, and the
        difference is deliberate: **the booking policy and the published
        availability are not applied.** Those rules protect a customer from
        booking too close to the hour or a year ahead, and they keep a stranger
        from taking a slot at three in the morning. A provider writing in their
        own diary is not a stranger, and a diary that refuses to record what
        already happened is a diary the salon keeps on paper instead.

        What still arbitrates is the exclusion constraint. Two people cannot
        hold one chair at one time, whoever entered them, so a walk-in that
        collides with a booked appointment is `409` exactly as a public booking
        would be.

        The appointment is created `CONFIRMED`: the provider entering it is the
        acceptance, and there is nobody left to accept it afterwards.

        `customer.preferred_channel` works exactly as it does on the public
        route, and it is the counter's job to ask: the person standing there
        is the one who knows whether they read e-mail. Omitting it means
        `WHATSAPP`; choosing `EMAIL` without `customer.email` is `400
        VALIDATION_FAILED`.
      security:
        - oauth2: [appointments:write]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            The same hazard as on the public route - a retried request must not
            burn a second chair. The same key with the same body replays the
            first result and returns `200`; with a different body it is `422
            IDEMPOTENCY_KEY_REUSED`.
          schema:
            type: string
            minLength: 1
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookAppointmentRequest'
      responses:
        '201':
          description: The appointment was written into the diary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentCreatedView'
        '200':
          description: |
            This key already created this appointment. The body is the first
            result, unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentCreatedView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `SLOT_UNAVAILABLE` - that chair is taken at that time. The only
            rule this route does not waive.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            `IDEMPOTENCY_KEY_REUSED` - the key was replayed with a different
            body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: |
            `RATE_LIMITED` - too many writes arrived at once for this slot and
            none could be ordered. Retry with the same key.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/appointments/{id}/cancellation:
    post:
      operationId: cancelAppointment
      tags: [agenda]
      summary: Cancel one of the caller's appointments
      description: |
        A capability, not a status field. There is no operation that sets an
        appointment's state directly: the machine is internal, and what a client
        can express is the thing it wants to happen.

        Cancelling frees the slot as a side effect of the same statement - the
        exclusion constraint is partial on the active statuses - so there is no
        moment in which the slot is neither taken nor free.

        The provider's own cancellation deadline does not apply here. It is a
        promise made to customers about how late they may cancel, and the
        provider is not bound by their own policy.

        An appointment that is not the caller's answers exactly as one that does
        not exist.
      security:
        - oauth2: [appointments:write]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAppointmentRequest'
      responses:
        '200':
          description: The appointment as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: '`UNAUTHENTICATED` - no verified token, or it expired.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: '`FORBIDDEN` - the subject belongs to no active provider.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `INVALID_STATE_TRANSITION` - the appointment has already reached a
            state it cannot leave. Cancelling twice lands here, and so does
            cancelling something already completed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/me:
    get:
      operationId: describeCurrentMember
      tags: [team]
      summary: Who the caller is at their own business
      description: |
        The identifier a signed-in person needs to ask about themselves, and
        could not get. `listOpeningHours` and `listClosures` both require a
        `staff_id`, and the only place a `staff_id` was published is
        `listStaff` - which is fine for an owner reading the team and useless
        for an employee, who could see every colleague's identifier and had no
        way to know which one was theirs.

        Strictly about the person. Which business this is, and what it
        published, is `getProviderProfile`: one resource per question, and the
        client that boots needs both regardless.
      security:
        - oauth2: [dashboard:read]
      responses:
        '200':
          description: The caller, as their own business knows them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentMemberView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            `FORBIDDEN` - a verified token whose subject belongs to no active
            provider. Deliberately not an empty body: a signed-in person with
            no membership has an account, not a business, and telling them so
            is the difference between "finish signing up" and "something
            broke".
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/staff:
    post:
      operationId: addStaffMember
      tags: [team]
      summary: Add someone to the caller's own team
      description: |
        A member is a bookable resource, not an account. A salon adds a chair
        and the person who works it long before that person signs in - many
        never will - so nothing here creates a login, and a member with no
        account is the ordinary case rather than a degraded one.

        Every member is created as staff. The owner is the row registration
        wrote, and there is exactly one.
      security:
        - oauth2: [staff:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffRequest'
      responses:
        '201':
          description: The member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      operationId: listStaff
      tags: [team]
      summary: List the caller's own staff
      description: |
        Opening hours and closures belong to a person, not to a business: a
        salon where one stylist works Saturdays and another does not is the
        normal case, and a schedule that could not say so would be wrong for
        everyone but the solo provider.
      security:
        - oauth2: [dashboard:read]
      responses:
        '200':
          description: The caller's staff, active first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/booking-policy:
    get:
      operationId: getBookingPolicy
      tags: [profile]
      summary: The rules the caller's own diary runs by
      description: |
        Five values that were declared in the schema, enforced everywhere, and
        writable by nothing. Every provider on the platform was frozen on the
        defaults - a fifteen-minute grid, an hour of notice, a sixty-day
        horizon, two hours to cancel, and confirmation on arrival - and a
        caterer who needs two days' notice had no request that said so.

        Its own resource rather than five more fields on the public profile.
        That one is what a customer reads; this one is how the business runs,
        and mixing them would mean an edit to an address could quietly reset a
        notice period - a loss nobody notices until a customer books too late.
      security:
        - oauth2: [dashboard:read]
      responses:
        '200':
          description: The policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPolicyView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: replaceBookingPolicy
      tags: [profile]
      summary: Change the rules the caller's own diary runs by
      description: |
        All five together, because they are one policy and a partial edit leaves
        the question of what happened to the ones nobody mentioned.

        Changing them never moves an appointment already taken. What is booked
        stays booked; the new rules decide what can still be.
      security:
        - oauth2: [profile:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingPolicyRequest'
      responses:
        '200':
          description: The policy as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPolicyView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/provider-profile/readiness:
    get:
      operationId: getReadiness
      tags: [profile]
      summary: What is still missing before you can publish
      description: |
        The three conditions have existed since publishing had a gate, and until
        now they were only ever spoken as a REFUSAL: a provider filled in a
        form, pressed publish, and was told what they should have done first.
        Registration then dropped them on that form with no idea any of it
        existed.

        Answered by the same predicates the gate itself uses, in one call.
        Three separate reads from a client would put the definition of "ready"
        in two places, and the second would drift the first time a condition
        changed.

        `has_bookable_staff` is asked separately even though nobody bookable
        also means no combined hours: told "you have no opening hours" when the
        real problem is that nobody is bookable, a provider goes and fills in a
        week that was already there.
      security: [{ oauth2: [dashboard:read] }]
      responses:
        '200':
          description: Where this business is on the way to being live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessView'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/provider-profile/qr-code:
    get:
      operationId: getProviderQrCode
      tags: [profile]
      summary: The square a customer scans
      description: |
        An SVG, not a raster, because a provider prints this - on a card, on a
        window, on the back of a receipt. A bitmap has one size and it is the
        wrong one at the printer's; a vector has none.

        It encodes `public_url` from the profile, which is the page a customer
        lands on. Error correction is at level Q: a code on a shopfront gets
        rained on, scuffed and photographed at an angle, and twenty-five per
        cent recoverable is what printed codes are made at.

        Cached for a day. It changes only if the slug changes, and the slug
        cannot change - it is on every card already handed out.
      security: [{ oauth2: [dashboard:read] }]
      responses:
        '200':
          description: The code.
          content:
            image/svg+xml:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/provider-profile/logo:
    post:
      operationId: replaceProviderLogo
      tags: [profile]
      summary: Replace the caller's own logo
      description: |
        The bytes, with their type in `Content-Type`. No multipart and no
        filename: a filename is a value the server would have to distrust and
        would gain nothing from trusting.

        JPEG and PNG only, and the check is on the bytes rather than on the
        header - a declared type is a claim, and the first two bytes are a fact.
        The image is decoded and re-encoded server-side, which proves it is an
        image at all and strips every piece of metadata that came with it,
        including the GPS coordinates a phone writes into a photo without being
        asked.

        Replacing one drops the previous file.
      security:
        - oauth2: [profile:write]
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The profile, carrying the new URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderProfileView'
        '400':
          description: '`VALIDATION_FAILED` - not an image, too large, or a type
            this platform does not accept.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/provider-profile/cover:
    post:
      operationId: replaceProviderCover
      tags: [profile]
      summary: Replace the caller's own cover image
      description: |
        The same rules as the logo, and a larger bound: a cover is the width of
        the page.
      security:
        - oauth2: [profile:write]
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The profile, carrying the new URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderProfileView'
        '400':
          description: '`VALIDATION_FAILED` - not an image, too large, or a type
            this platform does not accept.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/media/{name}:
    get:
      operationId: getMedia
      tags: [discovery]
      summary: An image a provider published
      description: |
        Public, because the page that shows it is. The name is minted by the
        server and carries no meaning - not the provider, not the kind, not the
        original filename - so the URL discloses nothing and cannot be walked.

        Served by the application today, which is honest rather than ideal: this
        belongs behind a CDN, and the store is a port precisely so moving it
        there changes one adapter.
      security: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{16,64}\.(jpg|png)$'
      responses:
        '200':
          description: The image.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/staff/{id}:
    put:
      operationId: replaceStaffMember
      tags: [team]
      summary: Change one of the caller's own people
      description: |
        The whole member, not a field at a time.

        There is no delete. A person who has left is `active: false`: their past
        appointments still name them, and a row removed would take the history
        with it. An inactive member keeps their hours and simply stops counting
        towards when the business is open.

        Standing someone down while they are the last bookable person at a
        published business is `409 INVALID_STATE_TRANSITION` - it would leave a
        page on the public path with nothing behind it. Unpublish first.

        `role` is not here. Ownership moves through a separate conversation, not
        through an edit form.
      security:
        - oauth2: [staff:write]
      parameters:
        - $ref: '#/components/parameters/StaffId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffRequest'
      responses:
        '200':
          description: The member as they now stand.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`INVALID_STATE_TRANSITION` - the last bookable person at
            a published business cannot be stood down.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/staff/{id}/ownership:
    post:
      operationId: transferOwnership
      tags: [team]
      summary: Hand the business over
      description: |
        The owner gives the business to a colleague, and stops being the owner
        in the same statement. There is no way back from the caller's side -
        only the new owner can hand it back - which is the correct shape for
        this operation and the reason the refusals below are strict.

        Until this existed there was an `OWNER` and nothing moved it, so a
        founder who sold the salon or took a partner had one workaround: give
        somebody their password. That is how one account ends up shared by three
        people and an audit trail stops meaning anything.

        The recipient must already have an account. Handing a business to a
        chair with no login would leave it owned by somebody nobody can be: the
        role would resolve for no subject, and the way out would be a migration.

        Everything else about both people is untouched - whether they take
        bookings, their hours, their appointments. Ownership is who may publish
        the page, hire, and hand it on; it is not a chair.
      security: [{ oauth2: [staff:write] }]
      parameters:
        - name: id
          in: path
          required: true
          description: The colleague taking it over.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The team as it now stands, owner first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffList'
        '403':
          description: FORBIDDEN - the caller does not own this business.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            VALIDATION_FAILED - not an active colleague with an account, or the
            caller naming themselves. One answer for all of them: the owner does
            the same thing with each, which is pick somebody else.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/staff/{id}/invitation:
    post:
      operationId: inviteStaffMember
      tags: [team]
      summary: Mint a code that lets one of your people sign in
      description: |
        A member is a bookable chair, and most of them never sign in. This is for
        the ones who should: the owner mints a code for a chair that already
        exists and hands it to the person who sits in it.

        Nothing is sent. The owner already has a way to reach their own
        employee, and a channel this platform does not yet have would only stand
        between them.

        Issuing a second code replaces the first, which is also how one is
        revoked. A code expires after seven days, is spent the moment it is
        redeemed, and can never be redeemed into an owner's row.
      security:
        - oauth2: [staff:write]
      parameters:
        - $ref: '#/components/parameters/StaffId'
      responses:
        '201':
          description: The code, returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffInvitationView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`INVALID_STATE_TRANSITION` - that member already has an
            account, or is the owner.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/invitations/{code}/acceptance:
    post:
      operationId: acceptStaffInvitation
      tags: [invitations]
      summary: Join the team that invited you
      description: |
        The second route on this platform that is authenticated and carries no
        tenant, and for the same reason as the first: the caller has no
        membership yet, and this is what gives them one.

        Sign up first - the account is ordinary - then redeem the code. It
        declares no scope, because a scope says what a caller may do inside
        their own provider and they do not have one.

        An unknown code, an expired one, one already redeemed and one belonging
        to a suspended business are the same `404`. Telling them apart would say
        whether a code ever existed to anyone who guesses.
      security:
        - oauth2: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            minLength: 20
            maxLength: 64
            pattern: '^[A-Za-z0-9_-]+$'
      responses:
        '200':
          description: The team you have joined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinedProviderView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`ALREADY_REGISTERED` - this account already belongs
            somewhere.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/providers/{slug}/staff:
    get:
      operationId: listPublicStaff
      tags: [discovery]
      summary: Who a customer can ask for
      description: |
        The people a customer may name when booking, and nothing else about
        them: a display name and the identifier `bookAppointment` accepts. No
        role, so a customer cannot tell the owner from an employee; no account,
        no contact details, no working hours - an individual's weekly pattern is
        a fact about a named person, and a customer needs it no more than they
        need to know who is busy.

        Only people who are active and bookable appear. Omit `staff_id` when
        booking and the server picks; send one and the customer has asked for
        that person, which is a different promise and a different answer when
        the slot is gone.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProviderSlug'
      responses:
        '200':
          description: The bookable people.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStaffList'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/opening-hours:
    get:
      operationId: listOpeningHours
      tags: [schedule]
      summary: Read one staff member's weekly hours
      description: |
        The segments of each day, in the provider's own local time. Breaks are
        the gaps between segments; there is no separate notion of one.
      security:
        - oauth2: [dashboard:read]
      parameters:
        - $ref: '#/components/parameters/StaffIdQuery'
      responses:
        '200':
          description: The weekly hours.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningHours'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: replaceOpeningHours
      tags: [schedule]
      summary: Replace one staff member's weekly hours
      description: |
        The whole week, not a day at a time. A provider thinks in weeks, and a
        per-day edit leaves the question of what happens to the days that were
        not mentioned - which is exactly the ambiguity that empties a Saturday
        nobody meant to close.

        An end before a start is a window that wraps past midnight, which is a
        real thing for a provider open until one in the morning. Equal is the
        only nonsense, and it is refused.

        Changing hours never moves an appointment already booked. What is
        already taken stays taken; the new hours decide what can still be.
      security:
        - oauth2: [schedule:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningHoursRequest'
      responses:
        '200':
          description: The hours as they now stand.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningHours'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/closures:
    get:
      operationId: listClosures
      tags: [schedule]
      summary: List the days that differ from the weekly hours
      description: |
        A date may carry several entries and they compose in one order:
        `CLOSED` anywhere on the date wins, otherwise `CUSTOM_HOURS` windows
        replace the day's weekly rules, and `TIME_OFF` windows are then taken
        out of whatever is left.
      security:
        - oauth2: [dashboard:read]
      parameters:
        - $ref: '#/components/parameters/StaffIdQuery'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The closures and one-off hours in the range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosureList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createClosure
      tags: [schedule]
      summary: Close a day, change its hours, or take an hour out of it
      description: |
        `CLOSED` carries no times; `CUSTOM_HOURS` and `TIME_OFF` require both.
        The database states that as its own constraint, so a request that gets
        it wrong is refused rather than stored as a day that means nothing.

        Post several entries for one date when the day needs them: a morning
        window and an afternoon window, or an ordinary day with one hour taken
        out of it. They all apply. Until now only one of them did, chosen
        arbitrarily, and the rest were accepted with `201` and then ignored.
      security:
        - oauth2: [schedule:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClosureRequest'
      responses:
        '201':
          description: The closure as created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosureView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/closures/{id}:
    delete:
      operationId: deleteClosure
      tags: [schedule]
      summary: Remove a closure, restoring the weekly hours for that day
      description: |
        Deleted rather than retired, unlike a service. Nothing was ever booked
        against a closure, so there is no history in it to keep.
      security:
        - oauth2: [schedule:write]
      parameters:
        - $ref: '#/components/parameters/ClosureId'
      responses:
        '204':
          description: The day follows the weekly hours again.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/service-offerings:
    get:
      operationId: listServiceOfferings
      tags: [catalogue]
      summary: List the caller's own services
      description: |
        Every service the caller owns, retired ones included unless narrowed.
        The provider's own view, so it carries the price whether or not the
        public page shows it.
      security:
        - oauth2: [dashboard:read]
      parameters:
        - name: active
          in: query
          required: false
          description: Omit for every service. A retired one is kept, never
            deleted - appointments that were booked at its price still name it.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The caller's services, in their display order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOfferingPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createServiceOffering
      tags: [catalogue]
      summary: Add a service
      description: |
        The name is unique among the caller's active services, case-insensitively:
        two live services called Tresses are two things a customer cannot choose
        between.
      security:
        - oauth2: [catalog:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceOfferingRequest'
      responses:
        '201':
          description: The service as created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOfferingView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            `INVALID_STATE_TRANSITION` - an active service already carries that
            name.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/service-offerings/{id}:
    put:
      operationId: replaceServiceOffering
      tags: [catalogue]
      summary: Change a service, or retire it
      description: |
        The whole representation, not a patch: a partial update over a price and
        two buffers is a shape where forgetting a field silently changes it.

        Changing a price or a duration never moves an appointment already
        booked. Those were frozen onto the row at the time, which is what makes
        a past booking still say what the customer was quoted.

        Retiring is `active: false`. There is no delete.
      security:
        - oauth2: [catalog:write]
      parameters:
        - $ref: '#/components/parameters/ServiceOfferingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceOfferingRequest'
      responses:
        '200':
          description: The service as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOfferingView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `INVALID_STATE_TRANSITION` - another active service already carries
            that name.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/appointments/{id}/reschedule:
    post:
      operationId: rescheduleAppointment
      tags: [agenda]
      summary: Move an appointment to another slot, or another chair
      description: |
        Recomputed server-side from the service's own duration and buffers, and
        arbitrated by the same exclusion constraint a first booking faces: the
        slot is either free at the new time or it is not. The appointment keeps
        its id, so its history and its notifications follow it.

        `staff_id` moves it to another colleague. A salon reassigns work all
        day - somebody calls in sick, a regular asks for a particular pair of
        hands - and the constraint keys on the staff member, so the move is
        arbitrated as a booking on the new chair and releases the old one in
        the same statement.

        Reminders owed for the old time are withdrawn and the new ones planned,
        in the same transaction as the move.
      security:
        - oauth2: [appointments:write]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleAppointmentRequest'
      responses:
        '200':
          description: The appointment as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: '`UNAUTHENTICATED` - no verified token, or it expired.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: '`FORBIDDEN` - the subject belongs to no active provider.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `SLOT_UNAVAILABLE` if the new slot is taken, or
            `INVALID_STATE_TRANSITION` if the appointment can no longer move.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            `SLOT_OUTSIDE_AVAILABILITY` - the new start falls outside what the
            provider published.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/appointments/{id}/readiness:
    post:
      operationId: markAppointmentReady
      tags: [agenda]
      summary: Say that a dropped-off job is ready
      description: |
        The customer left the work and went away; this is what tells them to
        come back. It is the only thing they are actually waiting for.

        Not a status. `AppointmentStatus` is a closed, published enum that
        clients branch on, and "ready" is not a state of the APPOINTMENT - the
        appointment happened when the work was handed over. It is a fact about
        the work, so it is its own field and its own operation.

        Only on a drop-off. An on-site appointment has nothing to be ready:
        the customer sat in the chair and left with the result, and `422` says
        so rather than writing a date nobody can act on.

        Idempotent by nature: saying it twice keeps the first instant, because
        the customer was told once.
      security:
        - oauth2: [appointments:write]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: The appointment, now carrying `ready_at`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`INVALID_STATE_TRANSITION` - the appointment was
            cancelled, so there is nobody to come back.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`VALIDATION_FAILED` - this appointment is not a
            drop-off.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/appointments/{id}/promise:
    put:
      operationId: replaceReadyBy
      tags: [agenda]
      summary: Move the promised date of a dropped-off job
      description: |
        "The machine broke, it will be Friday." It is the most frequent event
        of these trades, and a promise that could not move would be a promise
        the provider breaks in silence.

        A whole replace of one value rather than a patch, for the same reason
        every other write here is: what is sent is what stands.

        It may not fall before the handover ended - a job cannot be ready
        before it was given - and the database says so as well as this.
      security:
        - oauth2: [appointments:write]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadyByRequest'
      responses:
        '200':
          description: The appointment, carrying the new promise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`VALIDATION_FAILED` - not a drop-off, or a date before
            the handover.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/appointments/{id}/confirmation:
    post:
      operationId: confirmAppointment
      tags: [agenda]
      summary: Confirm a pending appointment
      description: |
        Only a `PENDING` appointment can be confirmed, so a provider that
        confirms on arrival never needs this - there is nothing left to accept.
        Accepting one sends the customer the message they have been waiting for;
        until this was wired, confirming notified nobody.

        Confirming one twice is
        refused rather than silently repeated: the second caller believed
        something was still pending that was not.
      security:
        - oauth2: [appointments:write]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: The appointment as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: '`UNAUTHENTICATED` - no verified token, or it expired.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: '`FORBIDDEN` - the subject belongs to no active provider.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `INVALID_STATE_TRANSITION` - only a pending appointment confirms.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/appointments/{id}/completion:
    post:
      operationId: completeAppointment
      tags: [agenda]
      summary: Mark an appointment as honoured
      description: |
        Only a `CONFIRMED` appointment completes. The slot is already past; what
        this records is that the customer came.
      security:
        - oauth2: [appointments:write]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: The appointment as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: '`UNAUTHENTICATED` - no verified token, or it expired.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: '`FORBIDDEN` - the subject belongs to no active provider.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `INVALID_STATE_TRANSITION` - only a confirmed appointment completes.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/appointments/{id}/no-show:
    post:
      operationId: markAppointmentNoShow
      tags: [agenda]
      summary: Record that the customer did not come
      description: |
        Only a `CONFIRMED` appointment can be a no-show. Kept apart from
        cancellation on purpose: a customer who cancelled and a customer who
        simply did not arrive are different facts about the same empty chair,
        and a provider deciding whom to take next time needs to tell them
        apart.
      security:
        - oauth2: [appointments:write]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: The appointment as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: '`UNAUTHENTICATED` - no verified token, or it expired.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: '`FORBIDDEN` - the subject belongs to no active provider.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `INVALID_STATE_TRANSITION` - only a confirmed appointment can be a no-show.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/providers/{slug}/available-slots:
    get:
      operationId: listAvailableSlots
      tags: [availability]
      summary: List the slots a customer could book
      description: |
        Returns only slots that can actually be booked right now. Busy time is
        not represented at all - no `available: false` entries, no busy
        intervals, no annotated gaps.

        That is not a timing precaution. A uniform grid with an availability
        flag is a minute-by-minute occupancy map of a named person at a named
        address, served to anyone who can spell the slug and trivially scraped
        on a schedule. A client that wants a grid for layout lays these slots
        over the provider's opening hours, which are public in their own right.

        An unknown slug and an unpublished provider answer identically.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProviderSlug'
        - name: service_offering_id
          in: query
          required: true
          description: Which service is being booked; its duration and buffers
            decide what a slot occupies.
          schema:
            type: string
            format: uuid
        - name: staff_id
          in: query
          required: false
          description: Ask about one staff member. Omit for the whole bookable
            team.
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          description: First date to consider, in the provider's own zone.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Last date to consider. A range longer than 31 days is
            truncated to 31 days from `from`.
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The bookable slots in the requested range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableSlotPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/bookings/{reference}:
    get:
      operationId: getBooking
      tags: [booking]
      summary: What a customer booked
      description: |
        A customer has no account and will not be made to have one. The reference
        minted at booking, and sent with the confirmation, is the whole
        authorisation: it names one appointment and grants nothing else.

        It is not the appointment's identifier. That one is on the provider's
        agenda, in the audit trail and in log lines, and a capability has to be a
        value whose only job is to be one - so that widening where the
        identifier is used never widens what the identifier can do.

        An unknown reference and one belonging to a business the platform has
        suspended are the same `404`. A provider that merely unpublished still
        owes this answer: it took the booking.
      security: []
      parameters:
        - $ref: '#/components/parameters/BookingReference'
      responses:
        '200':
          description: The booking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerBookingView'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/bookings/{reference}/reschedule:
    post:
      operationId: rescheduleBooking
      tags: [booking]
      summary: Move it
      description: |
        The other half of a capability that only had one. A customer could call
        an appointment off and could not move it, so somebody who needed Thursday
        instead of Wednesday had to cancel - releasing the slot to whoever
        refreshed the page first - and book again. That is a worse outcome for
        everybody, and it is the reason a salon's phone rings.

        Bound by the SAME notice period as a cancellation, because it is the
        same disruption: a chair emptied an hour before it was due is emptied
        whether or not something is put in its place. `cancellable_until` on the
        booking says in advance whether this will work.

        The service and the person do not change. A customer who wants a
        different service, or a different braider, is making a new booking, and
        this operation would be a way to acquire one slot while holding another.
        So the same colleague is kept, and if they are busy at the new time the
        answer is `409` - not a silent move to somebody else the customer never
        chose.

        On a drop-off, the promise moves with the handover: it is re-derived
        from the delay frozen at booking, because a promise anchored to a
        handover that no longer exists is not a promise.
      security: []
      parameters:
        - $ref: '#/components/parameters/BookingReference'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleBookingRequest'
      responses:
        '200':
          description: The booking, moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerBookingView'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`SLOT_UNAVAILABLE` - somebody else has the new time, or
            `INVALID_STATE_TRANSITION` - it is already over or cancelled.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`CANCELLATION_DEADLINE_PASSED` - too late to do this
            online - or `SLOT_OUTSIDE_AVAILABILITY`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/bookings/{reference}/cancellation:
    post:
      operationId: cancelBooking
      tags: [booking]
      summary: Call it off
      description: |
        Subject to the provider's own notice period, which binds the customer and
        not the provider: a salon cancelling its own appointment is managing its
        diary. `cancellation_deadline_minutes` has been a column since the schema
        was written and was enforced nowhere, which is the same as not having it.

        Past the deadline this is `422 CANCELLATION_DEADLINE_PASSED` and the
        customer telephones - which is the right outcome, because at that point
        the salon has a decision to make and a form cannot make it.

        `cancellable_until` on the booking says in advance whether this will
        work, so a client need not offer a button that answers 422.
      security: []
      parameters:
        - $ref: '#/components/parameters/BookingReference'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAppointmentRequest'
      responses:
        '200':
          description: The booking, cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerBookingView'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`INVALID_STATE_TRANSITION` - it is already over or
            already cancelled.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`CANCELLATION_DEADLINE_PASSED` - too late to do this
            online.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/providers/{slug}/appointments:
    post:
      operationId: bookAppointment
      tags: [booking]
      summary: Book an appointment on a provider's public page
      description: |
        Creates the appointment, `PENDING` or `CONFIRMED` according to the
        provider's own policy - most confirm on arrival, and the response says
        which so a client never has to guess. This paragraph said `PENDING`
        unconditionally and was wrong for almost every provider.

        The slug carries the tenant here, and
        only here: a customer is not staff, so membership resolution yields
        nothing for them and a booking route with no tenant identifier would
        answer 403 to the very people it exists for. The slug grants nothing
        beyond what the public page already shows, and this path may do exactly
        two things - create a pending appointment, and read the public
        projections.

        The server recomputes the window from the offering's own duration and
        buffers, and freezes the price from the offering. Neither is accepted
        from the client.

        The customer says how they want to hear back, through
        `customer.preferred_channel`. Omitting it means `WHATSAPP`, so nothing
        sent before that field existed changes meaning. Choosing `EMAIL`
        without `customer.email` is `400 VALIDATION_FAILED` and is refused
        here, at the edge, rather than surfacing hours later as a message
        addressed to nowhere.

        Retry semantics: a `409` means the slot is gone, so re-read
        availability rather than retrying the same body. A `429` and a `5xx`
        are safe to retry with the same `Idempotency-Key`; no `4xx` other than
        `429` is.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProviderSlug'
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            The same key with the same body replays the first result and
            returns `200`. The same key with a different body is `422
            IDEMPOTENCY_KEY_REUSED`. The key is retained for the life of the
            appointment - not for a fixed window.
          schema:
            type: string
            minLength: 1
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookAppointmentRequest'
      responses:
        '201':
          description: The appointment was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentCreatedView'
        '200':
          description: |
            This key already created this appointment. The body is the first
            result, unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentCreatedView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: |
            `FORBIDDEN` - this provider does not take a booking from this
            telephone number on the public page. The number is one the provider
            blocked in their own address book, and no other request can lift it:
            the caller's recourse is the salon itself.

            `FORBIDDEN` rather than a code of its own. The catalogue is closed,
            and this is what it means - the server understood, refuses, and
            nothing the caller can send changes the answer.

            The `title` deliberately does not say the number is blocked, and
            nothing else in the body does either. This route is
            unauthenticated, so a response that named the reason would let
            anybody who can spell the slug read a salon's blocklist one
            telephone number at a time, which is somebody else's business twice
            over.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `SLOT_UNAVAILABLE` - the slot was taken between the availability
            read and this write.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            `SLOT_OUTSIDE_AVAILABILITY` when the start falls outside what the
            provider published, or `IDEMPOTENCY_KEY_REUSED` when the key was
            replayed with a different body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: |
            `RATE_LIMITED` - too many bookings arrived at once for this slot
            and none of the attempts could be ordered. The slot may still be
            free: retry with the same key.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/categories:
    get:
      operationId: listCategories
      tags: [discovery]
      summary: The trades a customer can browse by
      description: |
        Curated, not provider-authored. A category is a navigation device and its
        value is that many providers share it: left to free text you get
        "Coiffure", "coiffure", "Coiffeuse" and "Salon de coiffure", each
        matching one business, and the hub stops working exactly when it starts
        having providers. What a provider says in its own words lives one level
        down, in its services.

        Ordered as they should be shown. `label_fr` is the label - the platform
        speaks French first - and the icon is a name, not a URL, so a client
        picks it out of its own set and the platform never ships an image for it.

        Withdrawn trades are absent. A provider that already carries one keeps
        it; nobody new can choose it.
      security: []
      responses:
        '200':
          description: The trades.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'

  /v1/service-offerings/{id}/photos:
    get:
      operationId: listServicePhotos
      tags: [catalogue]
      summary: What this service looks like
      description: |
        In the provider's own order. The first is the one that represents the
        service wherever a list shows only one, which is why the order is theirs
        to set rather than the upload date.
      security: [{ oauth2: [dashboard:read] }]
      parameters:
        - $ref: '#/components/parameters/ServiceOfferingId'
      responses:
        '200':
          description: The photographs, in the provider's own order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePhotoList'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: addServicePhoto
      tags: [catalogue]
      summary: Add a photograph
      description: |
        The bytes themselves, with their type in the header. No multipart and no
        filename: a filename is a value the server would have to distrust and
        would gain nothing from trusting.

        Five at most, and the cap is a promise about the PAGE rather than about
        storage. Five pictures is nothing to store; a catalogue of twelve
        services with no limit is a page that never finishes loading on a
        mid-range telephone over 3G, and the provider pays for that in customers
        who closed it.

        Every image is re-encoded and scaled to 1600 pixels on the long edge.
        That strips the metadata a telephone writes - including the coordinates
        of where the photograph was taken - and it is why nothing arrives on a
        customer's page at five megabytes.
      security: [{ oauth2: [catalog:write] }]
      parameters:
        - $ref: '#/components/parameters/ServiceOfferingId'
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: The photographs, with the new one in place.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePhotoList'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            VALIDATION_FAILED - not an image this platform publishes, or the
            fifth slot is already taken.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/service-offerings/{id}/photos/{photo_id}:
    delete:
      operationId: removeServicePhoto
      tags: [catalogue]
      summary: Remove a photograph
      description: |
        The freed slot is not backfilled. Renumbering would move every other
        photograph's position, and the first is the one that represents the
        service in a list - a provider who chose it would find it changed
        because they deleted something else.
      security: [{ oauth2: [catalog:write] }]
      parameters:
        - $ref: '#/components/parameters/ServiceOfferingId'
        - name: photo_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: What is left.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePhotoList'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/service-offerings/{id}/performers:
    get:
      operationId: listServicePerformers
      tags: [catalogue]
      summary: Who performs this service
      description: |
        Strict: the people listed here are the ones who can take a booking for
        this service, and anybody absent cannot. That is the loud failure rather
        than the quiet one - a service nobody performs is visible on the first
        booking attempt, while an exclusion somebody forgot to write sends a
        customer to the wrong chair and tells nobody.

        A provider who never opens this screen never notices it. A new service
        is granted to the whole team and a new colleague is granted the whole
        catalogue, so this is the way to REMOVE somebody - which is how a
        provider thinks about it anyway: "Fatou doesn't do nails".
      security: [{ oauth2: [dashboard:read] }]
      parameters:
        - $ref: '#/components/parameters/ServiceOfferingId'
      responses:
        '200':
          description: The team members who perform it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformerList'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: replaceServicePerformers
      tags: [catalogue]
      summary: Say who performs this service
      description: |
        The whole set, for the same reason opening hours are replaced a week at
        a time: a partial edit leaves the question of what happened to the names
        nobody mentioned.

        An empty list is accepted and means exactly what it says - nobody
        performs this service, and it can no longer be booked. That is a real
        thing a provider does when a specialist leaves, and refusing it would
        force them to retire the service instead.
      security: [{ oauth2: [catalog:write] }]
      parameters:
        - $ref: '#/components/parameters/ServiceOfferingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerformerRequest'
      responses:
        '200':
          description: The team members who now perform it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformerList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/bookings/{reference}/report:
    post:
      operationId: reportProvider
      tags: [booking]
      summary: Report a business
      description: |
        Tied to a booking reference, not to a public slug, and that is the whole
        design. This is a hub in a market where a salon's competitor is three
        streets away and knows its handle: an anonymous report button on a
        public page is something that competitor can press from a script, all
        night.

        The reference is the capability the customer already holds - the same
        one they use to reschedule or cancel - so a report comes from somebody
        who actually booked, and it arrives with the appointment attached.

        What this deliberately does not cover, said plainly rather than
        pretended: a customer who found a business here but booked over WhatsApp
        has no reference and cannot report. The answer to that is a contact
        address on the site, not a second endpoint that reopens the door this
        one closes.

        Pressing it twice is the same report. The provider can never read it.
      security: []
      parameters:
        - $ref: '#/components/parameters/BookingReference'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '202':
          description: |
            Filed. Deliberately 202 and not 201: nothing is created that the
            customer can then go and read, and no resource is returned. The
            platform has taken it, and what happens next is not theirs to poll.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/provider-profile/contestation:
    get:
      operationId: getContestation
      tags: [profile]
      summary: What you answered, if you answered
      description: |
        Empty for a business that is not suspended, which is almost every
        business almost always. A message about a decision nobody took is not
        worth showing, and an old one from a previous suspension would be worse.
      security: [{ oauth2: [dashboard:read] }]
      responses:
        '200':
          description: The answer, or nothing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContestationView'
        '204':
          description: Nothing to show - not suspended, or suspended and silent.
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: contestSuspension
      tags: [profile]
      summary: Answer the platform back
      description: |
        The third of the three things moderation needs. The platform has a trace
        of what it decided and a way to undo it; until now the business had the
        reason on its dashboard and nothing to do with it, and that asymmetry is
        what separates a platform from an arbitrary one.

        One message per suspension. A business that presses twice meant it once,
        and the only situation where a second message is about something new is
        being suspended again. Read it back with `getContestation`.

        It is not a form that reaches the salon's own inbox: the operator reads
        it beside the reports, and the platform holds a record that it was told.
      security: [{ oauth2: [profile:write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContestationRequest'
      responses:
        '201':
          description: Filed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContestationView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: INVALID_STATE_TRANSITION - this suspension is already answered.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: VALIDATION_FAILED - the business is not suspended.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/contestations:
    get:
      operationId: listContestations
      tags: [moderation]
      summary: What businesses have answered
      description: |
        Beside the reports and not merged with them: a customer complaining
        about a provider and a provider answering the platform are different
        things, read at different moments and acted on differently.

        Pending first, oldest first - a business waiting on an answer has been
        waiting since it was suspended. Each row carries the reason the provider
        carries NOW, which is absent once they have been reinstated: at a glance
        it says whether this is still about a live decision or one already
        undone.
      security: [{ oauth2: [admin:moderation] }]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, READ]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The answers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContestationPage'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/contestations/{id}/reading:
    post:
      operationId: readContestation
      tags: [moderation]
      summary: Mark one read
      description: |
        Records that the operator read it, and nothing else. Whether the
        business is reinstated is a separate decision with its own audit row - a
        contestation can be read and refused, and pretending otherwise would
        make the queue mean two things at once.
      security: [{ oauth2: [admin:moderation] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The contestation, now read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContestationView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/providers:
    get:
      operationId: listAllProviders
      tags: [moderation]
      summary: Every business on the platform
      description: |
        The listing the lever always needed. `suspendProvider` is keyed on a
        slug and nothing published one, so the operator could only act on a
        business a customer had already named in a complaint - and suspending
        meant typing a handle he had no way to look up.

        It crosses every provider, which is the whole reason the
        `admin:moderation` scope exists. It is also the only operation here that
        shows a business NOBODY has complained about: `listProviderReports` and
        `listContestations` are inboxes, and an inbox cannot answer "who is on
        this platform".

        What it shows is what a suspension is decided from, and nothing more.
        `appointment_count` is the one that changes decisions: suspending does
        not cancel a single booking already taken, so a salon holding forty of
        them is forty customers still expected at the door, and the number has
        to be visible before the lever is pulled rather than after.

        It is not `listProviders` with a wider filter. That operation serves the
        public, shows only published and active businesses, and carries a card's
        worth of marketing. This one shows the unpublished and the suspended -
        precisely the rows the public path hides - and carries no contact
        details at all.

        Ordered by name, always, for the reason `listProviders` is: a cursor
        over an ordered sequence is only meaningful while the order holds still.

        Customers are not in it. The operator sees that a business holds
        appointments, never who is in them; a moderation console that hands out
        every complainant's name and telephone number is a marketing list with a
        grievance attached.
      security: [{ oauth2: [admin:moderation] }]
      parameters:
        - name: q
          in: query
          required: false
          description: Part of a business name, or part of its handle. The
            operator arrives holding one or the other - a name from a telephone
            call, a slug from a link somebody sent him.
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: status
          in: query
          required: false
          description: Omit for every business, whatever its standing.
          schema:
            $ref: '#/components/schemas/ProviderStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The businesses, by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeratedProviderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/providers/{slug}/suspension:
    post:
      operationId: suspendProvider
      tags: [moderation]
      summary: Take a business off the hub
      description: |
        The platform's only lever, and it is blunt on purpose. A suspended
        business disappears from the directory, its page answers 404, its
        booking route answers 404, and its slug stops resolving anywhere public
        - all from one predicate in one row-level security policy, so there is
        no corner of the public surface that keeps serving it.

        What it does NOT touch: appointments already booked. The salon still has
        its diary, its customers still hold their references, and the work
        already promised can still be done. Suspension stops NEW harm;
        cancelling somebody's Thursday appointment because the platform is
        investigating their salon would harm the customer, not the salon.

        The reason is mandatory and it is written twice: to `audit_logs`, which
        is the permanent record of who decided what and when, and onto the
        provider's own row, so the salon can open its dashboard and read why its
        page vanished instead of discovering it because customers stopped
        arriving.

        Suspending an already-suspended business, or a slug that does not exist,
        is the same 404. The two are not distinguished, for the reason the whole
        catalogue does not distinguish them.
      security: [{ oauth2: [admin:moderation] }]
      parameters:
        - $ref: '#/components/parameters/ProviderSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspensionRequest'
      responses:
        '200':
          description: The business is off the hub.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: reinstateProvider
      tags: [moderation]
      summary: Put a business back
      description: |
        Because the first suspension made in a hurry will sometimes be wrong,
        and a platform that cannot undo its own decision does not really have a
        moderation policy - it has a delete button.

        The reason is cleared from the provider's row. It stays in `audit_logs`
        with its date and its author: a reinstated business must not keep
        carrying the accusation, and the platform must not be able to pretend it
        never made it.
      security: [{ oauth2: [admin:moderation] }]
      parameters:
        - $ref: '#/components/parameters/ProviderSlug'
      responses:
        '200':
          description: The business is back on the hub.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: RESOURCE_NOT_FOUND - no such slug, or it is not suspended.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/reports:
    get:
      operationId: listProviderReports
      tags: [moderation]
      summary: What customers have reported
      description: |
        The inbox the lever needs. Without it, moderation is the operator
        refreshing pages hoping to notice fraud.

        Pending first, oldest first, because the oldest unanswered complaint is
        the one that has been ignored longest. Each row carries the business,
        the appointment it is about and its date, so a report reads as "this
        booking, this service, this day" rather than "someone says something".
      security: [{ oauth2: [admin:moderation] }]
      parameters:
        - name: status
          in: query
          required: false
          description: Omit for everything. `PENDING` is the working queue.
          schema:
            type: string
            enum: [PENDING, REVIEWED]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The reports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderReportPage'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/reports/{id}/review:
    post:
      operationId: reviewProviderReport
      tags: [moderation]
      summary: Mark a report seen
      description: |
        Two states and no workflow. A queue with five statuses that nobody moves
        is the mistake `providers.status` made - four values and no writer - and
        it is not worth making twice in the same schema.

        Reviewing records that the operator looked. It says nothing about
        whether the business was suspended; that is a separate decision with its
        own audit row, and a report can be perfectly real and still not warrant
        taking a salon off the hub.
      security: [{ oauth2: [admin:moderation] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The report, now reviewed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderReportView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/customers:
    get:
      operationId: listCustomers
      tags: [clientele]
      summary: The people this provider has served
      description: |
        `customers` has filled up on every booking since the table existed and
        nothing ever read it back: a salon could not see who its customers were,
        could not find the person who telephoned yesterday, and could not tell a
        regular from a first visit. The rows were there the whole time.

        Ordered by name, because that is how somebody reads an address book.
        `q` matches a name or a phone number, since a salon looking somebody up
        has one of the two and rarely the spelling; it needs two characters,
        below which it matches most of the book.

        `visits` counts appointments in every state, cancellations included - a
        count that hid them would make a serial canceller look like a new
        customer. `last_visit` is the most recent appointment START, past or
        future, which is what a salon means by "when did I last see them".
      security: [{ oauth2: [dashboard:read] }]
      parameters:
        - name: q
          in: query
          required: false
          description: Part of a name or a phone number.
          schema:
            type: string
            maxLength: 120
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The address book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/customers/{id}:
    get:
      operationId: getCustomer
      tags: [clientele]
      summary: One person, and what they booked
      description: |
        The history is most recent first and capped at fifty. A salon opening a
        regular's card wants the last few visits, not four years of them.
      security: [{ oauth2: [dashboard:read] }]
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: The customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetailView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/customers/{id}/notes:
    put:
      operationId: replaceCustomerNotes
      tags: [clientele]
      summary: What the provider remembers about them
      description: |
        The provider's own note, never shown to the customer and never sent
        anywhere: it is the line a salon writes to remember that somebody is
        allergic to a product, or always ten minutes late.

        An empty body clears it. A note of nothing but spaces is no note - it
        would render as a card that looks annotated and says nothing.
      security: [{ oauth2: [dashboard:read] }]
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerNotesRequest'
      responses:
        '200':
          description: The customer, as they now stand.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetailView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/customers/{id}/blocking:
    put:
      operationId: replaceCustomerBlocking
      tags: [clientele]
      summary: Refuse this person a booking on the public page
      description: |
        The one lever a provider has against somebody who does not turn up.
        `blocked` has been on the row since the table was created and nothing
        ever wrote it, so every customer was welcome for ever and a salon
        losing an hour a week to the same person could do nothing but answer
        the telephone.

        It binds the PUBLIC page, and only it. A provider writing a walk-in
        into their own diary is not restrained by their own refusal: somebody
        is standing at the counter, the argument was settled, and a diary that
        refuses to record what is happening is a diary the salon keeps on
        paper. That is the same line `bookWalkIn` already draws through the
        booking policy and the published availability.

        It is not retroactive. Appointments already in the book stand, exactly
        as suspending a business does not cancel the customers who are still
        coming on Thursday - the block says who may take a NEW slot, and
        cancelling what was promised is a separate decision with its own
        operation.

        Blocking somebody who is already blocked, or unblocking somebody who
        was never blocked, succeeds and changes nothing. The provider pressed
        a switch and the switch is where they left it.
      security: [{ oauth2: [dashboard:read] }]
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerBlockingRequest'
      responses:
        '200':
          description: The customer, as they now stand.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetailView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/localities:
    get:
      operationId: listLocalities
      tags: [discovery]
      summary: The places a business can be filed under
      description: |
        The closed part of the map: eight regions, thirty-three prefectures, and
        the ten communes of Conakry. Complete for the whole country, and it
        changes only by migration - the last time was January 2024, when the
        capital went from five communes to ten.

        Flat, with each row naming its parent. A tree of fifty-one nodes is one
        page and always will be, and a client that wants it nested builds it
        from the parents in one pass.

        What is deliberately NOT here is the quartier. There are thousands of
        them, the platform does not author them, and a partial list fails
        exactly the provider whose own is missing. That level is free text on
        the provider, and `listAreas` is where its values come from.
      security: []
      responses:
        '200':
          description: The whole map.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalityList'

  /v1/areas:
    get:
      operationId: listAreas
      tags: [discovery]
      summary: The quartiers providers have already written
      description: |
        Type-ahead, and the thing that keeps free text from fragmenting: the
        tenth hairdresser in Nongo is offered the "Nongo" the first nine
        created, instead of inventing "nongo centre" beside it.

        The values come from registrations, never from a list this repository
        carries. Only published providers contribute, so an unpublished one
        cannot put a word in front of a customer.
      security: []
      parameters:
        - name: q
          in: query
          required: false
          description: Part of a quartier name, folded before matching.
          schema:
            type: string
            maxLength: 80
        - name: locality
          in: query
          required: false
          description: Narrow to one region, prefecture or commune - the
            quartiers of Ratoma rather than of the whole country.
          schema:
            type: string
            maxLength: 80
      responses:
        '200':
          description: What has been written, most used first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaList'

  /v1/providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: Find a provider
      description: |
        The hub itself. Without it a business is reachable only by someone who
        already has its handle, which makes the platform a set of unconnected
        pages rather than a place to look for a hairdresser near you.

        Only published providers appear, and the same is true of every other
        public operation. A provider that has not published is not hidden from
        this list by a filter written here - it is invisible to the database
        role serving the request.

        Several `category_slug` may be given; a provider matching any of them is
        returned.

        Ordered by name, always, and never by how well a result matches. A
        cursor over a ranked sequence is only meaningful while the ranking
        holds still, and a similarity score moves every time any provider edits
        its name - so a client paging through search results would silently skip
        and repeat businesses. Alphabetical is stable, predictable, and lets the
        cursor be exactly the position the caller already read.

        `q` matches three things, because a customer types what they want rather
        than what a business is called: the business name, the trade's own
        label, and the name of any active service the provider offers. Somebody
        looking for braids types "tresses" - no business is named Tresses, and
        matching the name alone answered nothing.

        A service is MATCHED, never returned: a card carries a handle and a
        name, and the catalogue belongs to the provider's own page.

        It needs two characters: below that it matches most of the directory and
        answers nothing.
      security: []
      parameters:
        - name: q
          in: query
          required: false
          description: Part of a business name.
          schema:
            type: string
            minLength: 2
            maxLength: 120
        - name: category_slug
          in: query
          required: false
          explode: true
          description: |
            Repeat it to ask for several trades at once. That is what a wedding
            section is: one query over photographie, traiteur, dj-animation,
            decoration-evenementielle and the rest. "Mariage" is not a category,
            because a photographer shoots weddings and corporate events and
            portraits, and a provider has one trade.
          schema:
            type: array
            maxItems: 20
            items:
              type: string
              maxLength: 60
        - name: locality
          in: query
          required: false
          description: |
            A region, a prefecture, or one of Conakry's ten communes, by slug -
            `listLocalities` publishes them. Matched DOWN the tree: asking for
            `conakry` returns a business filed under `ratoma`, and asking for
            `ratoma` returns only Ratoma.

            This is the filter to use. `city` is what came before it and is
            kept only for the rows that predate it.
          schema:
            type: string
            maxLength: 80
        - name: area
          in: query
          required: false
          description: |
            The quartier, as providers write it - "Nongo", "Kipe", "Taouyah".
            Folded before comparing, so "Ratoma", "ratoma" and "RATOMA" are one
            value.

            Free text and not a list, because Guinea's quartiers are thousands
            of rows this platform does not author: a curated one would be
            missing exactly the neighbourhood the next provider lives in.
            `listAreas` offers what has already been written, which is what
            keeps the values from fragmenting.
          schema:
            type: string
            maxLength: 80
        - name: fulfilment
          in: query
          required: false
          explode: true
          description: |
            Repeat it to ask for several ways of being served at once.

            A business matches when ANY of its currently ACTIVE services offers
            ANY of the modes asked for - the same source, read the same way,
            that fills `fulfilments` on the card. Every provider returned
            therefore carries at least one of the modes asked for, so the filter
            and the badge can never disagree.

            ANY and not ALL. A customer ticking "a domicile" wants somebody who
            travels for something, not somebody who travels for everything, and
            a shop that also has a counter is not a worse answer for having one.

            A service that has been retired offers nothing. It is `active` that
            decides, exactly as it decides the badge, so a business whose only
            house-call service was withdrawn stops appearing under
            `AT_CUSTOMER` on the same day it stops offering it.

            Omitted is no filter, which is not the same as asking for none: a
            business with no active service publishes no mode at all and is only
            ever excluded by naming one.
          schema:
            type: array
            maxItems: 3
            items:
              $ref: '#/components/schemas/Fulfilment'
        - name: city
          in: query
          required: false
          deprecated: true
          description: |
            Superseded by `locality`. Matched whole and case-insensitively.
            Kept because it is the only geography the earliest rows carry.
          schema:
            type: string
            maxLength: 80
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The matching providers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: registerProvider
      tags: [providers]
      summary: Register the caller's business
      description: |
        The one authenticated operation that runs with no tenant. Everything
        else on this API resolves a provider from the verified subject through
        `users` and `provider_staff`; this is what puts those rows there. Until
        a subject has them, every other authenticated operation answers 403,
        which is exactly what a salon that has just signed up would otherwise
        hit forever.

        It declares no scope, and that is deliberate rather than an omission: a
        scope says what the caller may do *inside their own provider*, and the
        caller does not have one yet. Authentication is the whole requirement.

        The business is created dormant - `PENDING` and unpublished - so
        registering does not put an empty page on the public booking path. Fill
        in the services and the opening hours, then publish through
        `updateProviderProfile`.

        The account's display name and email come from the verified token, not
        from this body. A caller does not get to choose who they are.

        One account, one business. A second call from the same subject is
        `409 ALREADY_REGISTERED`, and a slug another business already holds is
        `409 SLUG_UNAVAILABLE` - two situations a client must be able to tell
        apart, because one is fixed by picking a different handle and the other
        is not fixed by anything.
      security:
        - oauth2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterProviderRequest'
      responses:
        '201':
          description: The business exists, dormant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderRegisteredView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: '`SLUG_UNAVAILABLE` - the handle is taken, or
            `ALREADY_REGISTERED` - this account already has a business.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/provider-profile:
    get:
      operationId: getProviderProfile
      tags: [profile]
      summary: Read the caller's own public page, as it stands
      description: |
        Singular because the caller has exactly one. There is no provider
        identifier in this request, and no collection of profiles to select
        from: the tenant is ambient.
      security:
        - oauth2: [dashboard:read]
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderProfileView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateProviderProfile
      tags: [profile]
      summary: Change the caller's own public page, and publish it
      description: |
        The whole profile, not a field at a time, for the same reason opening
        hours are replaced a week at a time: a partial edit leaves the question
        of what happened to the fields nobody mentioned.

        The slug is not in the request body and cannot be changed here. It is
        the string on the QR code, in the WhatsApp message and on the shopfront;
        changing it silently breaks every link already handed to a customer. A
        provider who genuinely needs a new handle is a support conversation, not
        a `PUT`.

        `published` is what puts the business on the public booking path, and it
        is refused with `409 INVALID_STATE_TRANSITION` until there is something
        to book: at least one active service and at least one stretch of opening
        hours. A published page with an empty calendar is worse than no page -
        a customer finds it, finds nothing, and does not come back.
      security:
        - oauth2: [profile:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderProfileRequest'
      responses:
        '200':
          description: The profile as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderProfileView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`INVALID_STATE_TRANSITION` - nothing is bookable yet, so
            the page cannot be published.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/providers/{slug}:
    get:
      operationId: getPublicProvider
      tags: [discovery]
      summary: A provider's public page
      description: |
        What a customer sees before they book: who the business is, where it is,
        and what it offers. Only published providers are reachable, and an
        unpublished one is the same `404` as a slug that was never taken - any
        way to tell those apart says whether a hidden business exists.

        A service whose price the provider chose not to show carries no `price`
        at all, rather than a zero or a null: the projection is shaped so the
        price cannot be leaked by a forgotten condition. Inactive services are
        absent, and the buffers padding each appointment are internal and are
        not published.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProviderSlug'
      responses:
        '200':
          description: The public page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProviderView'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/providers/{slug}/opening-hours:
    get:
      operationId: listPublicOpeningHours
      tags: [discovery]
      summary: When a provider is open
      description: |
        The counterpart to `listAvailableSlots`, and the reason that operation
        can return bookable slots alone. A shop's hours are already public - on
        its door - so publishing them costs nothing, while a uniform grid
        flagging which slots are taken would be a minute-by-minute occupancy map
        of a named person at a named address, served to anyone who can spell the
        slug. Lay the bookable slots over these hours for the grid; the slots
        remain the only statement about what can actually be booked.

        The hours of everyone bookable, merged: a salon is open when any of its
        people is working, and a customer laying out a grid does not care which.
        Overlapping stretches are merged into one, so a day never draws twice.

        Holidays and one-off closures are not represented here. They move which
        slots exist, and slots are where a customer should read them.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProviderSlug'
      responses:
        '200':
          description: The weekly hours.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOpeningHours'
        '404':
          $ref: '#/components/responses/NotFound'

components:

  securitySchemes:
    oauth2:
      type: oauth2
      description: |
        Scopes are coarse capability grants, checked at the service layer as
        well as here. None of the provider scopes crosses a provider: the tenant
        comes from the database via the subject, so a scope says what the caller
        may do inside their own provider and nothing about whose data they
        reach.

        `admin:moderation` is the single exception, and it is deliberately
        shaped so the exception is obvious. It grants no ordinary provider
        operation at all - it cannot read an agenda, a customer or a catalogue.
        What it grants is the whole of the `/v1/admin` namespace and nothing
        outside it: list the businesses, take one off the hub, put it back, read
        what customers reported and what businesses answered, and mark either
        seen. It is held by the platform operator and by nobody else, and every
        decision taken with it writes an audit row.
      flows:
        authorizationCode:
          authorizationUrl: /realms/balaaca/protocol/openid-connect/auth
          tokenUrl: /realms/balaaca/protocol/openid-connect/token
          scopes:
            dashboard:read: Read the caller's own agenda and settings.
            catalog:write: Create and change the caller's own services.
            schedule:write: Set the caller's own opening hours and closures.
            appointments:write: Create and move the caller's own appointments.
            profile:write: Change the caller's own public page, and publish it.
            staff:write: Add and change the caller's own people.
            admin:moderation: >
              List every business, suspend and reinstate any of them, and read
              what customers reported and what businesses answered. The platform
              operator's scope, and the only one that crosses providers.

  parameters:
    AppointmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StaffIdQuery:
      name: staff_id
      in: query
      required: true
      description: Whose schedule. A provider identifier never appears in a
        request; a staff identifier is one of the caller's own people, and the
        database confines it to them.
      schema:
        type: string
        format: uuid
    StaffId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClosureId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CustomerId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServiceOfferingId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BookingReference:
      name: reference
      in: path
      required: true
      description: |
        The capability minted at booking, and the only thing that distinguishes
        the person who booked from a stranger.

        Canonical form is `AAA-BBBBBB`: three letters taken from the business
        name, a hyphen, then six symbols drawn from an alphabet of 31 - the
        digits and the upper-case letters with `0`, `O`, `1`, `I` and `L`
        removed, because those are the characters a person hears wrong and
        reads wrong. Display it exactly as it was returned, and never inside
        anything that transforms case.

        It is ACCEPTED more loosely than it is minted, because it is meant to be
        said down a telephone and typed back in. Case is ignored and the hyphen
        is optional, so `sfa-k7m2qp` and `SFAK7M2QP` are the same reference as
        `SFA-K7M2QP`. Within the three initials - and only there, because the
        six-symbol alphabet contains none of them - `0` reads as `O`, and `1`
        and `L` read as `I`. That is why the pattern admits `0` and `1` in the
        first three positions and nowhere else: `S1L-K7M2QP` is how somebody
        transcribes `SIL-K7M2QP`, and it resolves.

        The six symbols admit no such tolerance and want none. `0`, `O`, `1`,
        `I` and `L` are not in that alphabet, so a character heard wrong there
        has no correct reading and the answer is `400`, not a `404` that leaves
        the customer wondering whether the booking still exists.

        The initials are a courtesy for a person reading a list of references,
        and for the salon recognising its own. They are not a secret, they grant
        nothing, and they are not a key on their own: the whole string is the
        key, and two references can never differ only in the characters above.

        This replaced 43 characters of base64url. That value was case-sensitive,
        so no page could display it in a heading without destroying it, and it
        could not be dictated at all. Every reference of the old shape was
        reissued when the format changed, so no client holds one that would
        still have worked.
      schema:
        type: string
        minLength: 9
        maxLength: 10
        pattern: '^[A-Za-z01]{3}-?[2-9A-HJKMNP-Za-hjkmnp-z]{6}$'
    ProviderSlug:
      name: slug
      in: path
      required: true
      description: The provider's public handle - the string on the QR code.
      schema:
        type: string
        pattern: '^[a-z0-9]([a-z0-9-]{1,58}[a-z0-9])$'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque. Pass back the `next_cursor` of the previous page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: How many entries to return.
      schema:
        type: integer
        minimum: 1
        default: 50
        maximum: 200

  responses:
    Unauthenticated:
      description: '`UNAUTHENTICATED` - no verified token, or it expired.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: '`FORBIDDEN` - the subject belongs to no active provider, or
        the token does not carry the scope this operation needs.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: '`VALIDATION_FAILED`, or `IDEMPOTENCY_KEY_REQUIRED` when a
        mutating operation arrived without the header.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: |
        `RESOURCE_NOT_FOUND`. One answer for a resource that does not exist and
        for one that is not the caller's, byte for byte: any way to tell them
        apart is an oracle for whether a hidden resource exists.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: |
        `RATE_LIMITED` - too many attempts arrived from one source.

        On the customer booking routes this is not a courtesy to the server, it
        is the second half of the authorisation. A booking reference is short
        enough to be read aloud, which is short enough to be enumerated: six
        symbols from an alphabet of 31 is 887 million per prefix, and a prefix
        is shared by every business whose initials match. The limit is what
        makes walking that space cost more than it is worth, and it is the
        reason the reference is allowed to be that short.

        `Retry-After` says how long to wait. Retrying sooner returns this same
        answer and counts against the limit.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:

    Problem:
      type: object
      description: RFC 7807. `code` is the stable value a client branches on;
        `title` is human text and may change.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          example: https://errors.balaaca.com/slot-unavailable
        title:
          type: string
          example: That slot is no longer available
        status:
          type: integer
          format: int32
          example: 409
        code:
          $ref: '#/components/schemas/ErrorCode'
        instance:
          type: string
          description: The trace id for this request. Quote it in a bug report;
            it is what ties the response to the server log.

    ErrorCode:
      type: string
      description: |
        The closed catalogue. Values are never renamed or reused once
        published, because clients branch on them. There is no code that
        distinguishes "not yours" from "does not exist", and none that names an
        internal concept.

        `PLAN_LIMIT_REACHED` was here and has been removed. It was published
        against a billing module that has one file and a `subscriptions` table
        with no Java at all, so no code path could ever return it: a client
        branching on it was branching on something that could not arrive. That
        is a worse contract than not publishing it, and removing it breaks no
        client, because no client can have seen it. It returns the day plan
        tiers exist - the four decisions that gate them are in docs/BACKLOG.md -
        and `ErrorCatalogueTest` now fails the build if a published code has no
        producer, so this cannot recur.
      enum:
        - VALIDATION_FAILED
        - IDEMPOTENCY_KEY_REQUIRED
        - UNAUTHENTICATED
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - SLOT_UNAVAILABLE
        - INVALID_STATE_TRANSITION
        - SLOT_OUTSIDE_AVAILABILITY
        - CANCELLATION_DEADLINE_PASSED
        - CURRENCY_MISMATCH
        - IDEMPOTENCY_KEY_REUSED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SLUG_UNAVAILABLE
        - ALREADY_REGISTERED

    AvailableSlot:
      type: object
      description: A slot a customer could take. Carries when it starts and
        when it ends, and nothing about who is free or busy.
      required: [starts_at, ends_at]
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time

    AvailableSlotPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AvailableSlot'
        next_cursor:
          type: string
          nullable: true
          description: Opaque; null on the last page.

    CustomerContact:
      type: object
      description: How the customer is reached. The phone is normalised to
        E.164 server-side from the provider's country.
      required: [full_name, phone]
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          minLength: 1
          maxLength: 24
          example: "622000001"
        email:
          type: string
          maxLength: 255
          description: |
            Required when `preferred_channel` is `EMAIL`, optional otherwise.
        preferred_channel:
          allOf:
            - $ref: '#/components/schemas/ContactChannel'
          description: |
            Which way this customer wants to hear about THIS booking. The
            person in front of a pharmacy counter is the one who knows what
            they actually read, so they are asked rather than the business.

            OMIT IT for `WHATSAPP`, which is what every request sent before
            this field existed means and why it is not required.

            Choosing `EMAIL` with no `email` is `400 VALIDATION_FAILED`,
            refused here rather than hours later when the message is due: a
            row addressed to nowhere is a confirmation that never arrives and
            a customer standing outside a closed salon.

            The choice is FROZEN onto the appointment, not remembered against
            the telephone number. Every message this booking owes - the
            confirmation, both reminders, a cancellation days later - carries
            the answer given when it was made, so booking again another way
            never rewrites what an earlier booking does.

    ContactChannel:
      type: string
      description: |
        A way to reach a customer.

        `WHATSAPP`: the number they booked with. The default, and what every
        booking taken before this field existed used.
        `EMAIL`: the address on the same contact, which then becomes required.

        Only what can actually be delivered is published here. SMS exists in
        the platform's internal vocabulary and has no adapter and no account
        behind it, so offering it would be a promise nothing keeps.

        It is a preference and not a guarantee. The platform freezes both
        addresses it holds onto the message it writes, so one the preferred
        channel cannot carry is sent by the other where an address for it
        exists rather than being dropped. What IS guaranteed is the refusal
        above: `EMAIL` is never accepted without an address to send to.

        A client that does not know a value should treat it as `WHATSAPP`.
      enum: [WHATSAPP, EMAIL]

    PerformerRequest:
      type: object
      required: [staff_ids]
      properties:
        staff_ids:
          type: array
          maxItems: 200
          items:
            type: string
            format: uuid
          description: |
            The whole set. A name sent twice is counted once; a name that is not
            on this provider's team is refused rather than skipped, because a
            request that silently dropped it would report success and leave the
            service performed by fewer people than the provider just said.

    PerformerList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Performer'

    Performer:
      type: object
      required: [staff_id, display_name, bookable]
      properties:
        staff_id:
          type: string
          format: uuid
        display_name:
          type: string
        bookable:
          type: boolean
          description: |
            Whether customers may pick them. Independent of competence: a
            receptionist who stops taking bookings has not forgotten how to
            braid, so they keep the competence and the booking path filters on
            this separately.

    SuspensionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: |
            Mandatory, and it is the point of the whole operation. The day a
            provider contests the decision, "who, when, why" has to exist - and
            a reason written at the moment of the decision is worth more than
            one reconstructed afterwards.

            The salon reads this on its own dashboard, so it is addressed to
            them, not to a file.
          example: Trois clients signalent des rendez-vous non honores.

    ModerationView:
      type: object
      required: [slug, status]
      properties:
        slug:
          type: string
        status:
          $ref: '#/components/schemas/ProviderStatus'
        suspended_at:
          type: string
          format: date-time
          description: Absent once reinstated.
        suspension_reason:
          type: string
          description: Absent once reinstated. The audit trail keeps it.

    ReportRequest:
      type: object
      required: [reason]
      properties:
        reason:
          $ref: '#/components/schemas/ReportReason'
        details:
          type: string
          maxLength: 1000
          description: In the customer's own words. Optional, because a person
            who was let down should not have to write an essay to say so.

    ReportReason:
      type: string
      description: |
        A closed set, because a queue of free text is unreadable at the only
        moment it matters. These five are what a customer in this market
        actually complains about.

        `NO_SHOW`: the business was closed, or nobody came.
        `NOT_AS_DESCRIBED`: the service was not what the page said.
        `OVERCHARGED`: a price other than the one quoted.
        `RUDE_OR_UNSAFE`: behaviour. The one that matters most.
        `OTHER`: with `details`.
      enum: [NO_SHOW, NOT_AS_DESCRIBED, OVERCHARGED, RUDE_OR_UNSAFE, OTHER]

    ProviderReportView:
      type: object
      required: [report_id, provider_slug, provider_name, reason, status,
                 reported_at, appointment_starts_at, service_name]
      properties:
        report_id:
          type: string
          format: uuid
        provider_slug:
          type: string
        provider_name:
          type: string
        reason:
          $ref: '#/components/schemas/ReportReason'
        details:
          type: string
        status:
          type: string
          enum: [PENDING, REVIEWED]
        reported_at:
          type: string
          format: date-time
        reviewed_at:
          type: string
          format: date-time
        appointment_starts_at:
          type: string
          format: date-time
          description: What the report is about, so it reads as an event rather
            than an accusation.
        service_name:
          type: string
        provider_status:
          $ref: '#/components/schemas/ProviderStatus'

    ProviderReportPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProviderReportView'
        next_cursor:
          type: string
          nullable: true

    CustomerSummaryView:
      type: object
      required: [customer_id, full_name, phone, visits]
      properties:
        customer_id:
          type: string
          format: uuid
        full_name:
          type: string
        phone:
          type: string
          description: E.164, as it was normalised when they first booked.
        email:
          type: string
        visits:
          type: integer
          format: int32
          description: Every appointment, in every state. Cancellations count.
        last_visit:
          type: string
          format: date-time
          description: The most recent appointment start, past or future. Absent
            for somebody who has never booked.

    CustomerDetailView:
      allOf:
        - $ref: '#/components/schemas/CustomerSummaryView'
        - type: object
          required: [history, blocked]
          properties:
            notes:
              type: string
              description: The provider's own. Never shown to the customer.
            blocked:
              type: boolean
              description: Whether this person is refused a booking on the
                public page. False for everybody until a provider says
                otherwise, and never true of somebody the provider has not
                blocked themselves.
            history:
              type: array
              items:
                $ref: '#/components/schemas/CustomerVisitView'

    CustomerVisitView:
      type: object
      required: [starts_at, service_name, status, staff_name]
      properties:
        starts_at:
          type: string
          format: date-time
        service_name:
          type: string
          description: What was frozen at booking, not what the service is called
            today.
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        staff_name:
          type: string

    CustomerNotesRequest:
      type: object
      properties:
        notes:
          type: string
          maxLength: 2000
          description: Omit or send empty to clear it.

    CustomerBlockingRequest:
      type: object
      required: [blocked]
      properties:
        blocked:
          type: boolean
          description: True refuses this person a booking on the public page;
            false lets them book again. Required, because a body that omitted
            it would have to mean one of the two and either reading is a
            provider's decision taken for them.

    CustomerPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CustomerSummaryView'
        next_cursor:
          type: string
          nullable: true

    ContestationRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: In the provider's own words.

    ContestationView:
      type: object
      required: [message, submitted_at, about_suspension_at, read]
      properties:
        message:
          type: string
        submitted_at:
          type: string
          format: date-time
        about_suspension_at:
          type: string
          format: date-time
          description: Which suspension this answers. A business can be
            suspended, contest, be reinstated and be suspended again.
        read:
          type: boolean
          description: Whether the operator has opened it. Not whether they
            agreed - that is a separate decision.

    ContestationQueueView:
      type: object
      required: [contestation_id, provider_slug, provider_name, provider_status,
                 message, about_suspension_at, status, submitted_at]
      properties:
        contestation_id:
          type: string
          format: uuid
        provider_slug:
          type: string
        provider_name:
          type: string
        provider_status:
          $ref: '#/components/schemas/ProviderStatus'
        message:
          type: string
        about_suspension_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING, READ]
        submitted_at:
          type: string
          format: date-time
        read_at:
          type: string
          format: date-time
        current_reason:
          type: string
          description: |
            The reason the provider carries NOW, absent once reinstated. Beside
            the message it says at a glance whether this is still about a live
            decision or one already undone.

    ContestationPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ContestationQueueView'
        next_cursor:
          type: string
          nullable: true

    ModeratedProviderView:
      type: object
      description: |
        A business as the platform operator sees it, which is a different thing
        from `ProviderSummary`. That one draws a card for a customer and is kept
        deliberately small because a directory is easy to scrape. This one is
        behind `admin:moderation`, shows what the public path hides - the
        unpublished and the suspended - and carries no way to contact anybody:
        not the business, and above all not its customers.
      required: [slug, business_name, published, status, registered_at,
                 appointment_count]
      properties:
        slug:
          type: string
          description: The handle every other moderation operation is keyed on.
            It is here so the operator can stop typing one he never saw.
        business_name:
          type: string
        trade:
          type: string
          description: |
            The trade's own label, as the taxonomy publishes it. A label rather
            than a slug: this is a column an operator reads once and acts on, so
            a second request to turn thirty-five slugs into words would buy
            nothing.

            Absent when the business has chosen no trade, which is a real state
            and one of the things worth looking for.
        locality:
          allOf:
            - $ref: '#/components/schemas/LocalityRef'
          description: Where the business is filed, at the finest level the
            published map has. Absent when it has never been placed.
        area:
          type: string
          description: The quartier, as the provider wrote it. Absent when they
            wrote none.
        published:
          type: boolean
          description: |
            Whether the provider has put their own page live. Not the same
            question as `status` and never conflated with it: `published` is the
            business's decision and it can undo it, `status` is the platform's
            and it cannot. A suspended business keeps `published: true` and
            still disappears from every public path.
        status:
          $ref: '#/components/schemas/ProviderStatus'
        registered_at:
          type: string
          format: date-time
          description: When the business first appeared. A salon that registered
            this morning and a salon that has been here two years are not the
            same complaint.
        appointment_count:
          type: integer
          format: int64
          description: |
            How many appointments the business holds, in total and whatever
            their state.

            The number that changes the decision. Suspending takes the page off
            the hub and does NOT cancel a single booking already taken, so this
            is how many customers are still expected at the door after the lever
            is pulled. It counts appointments and says nothing whatsoever about
            who is in them.
        suspension_reason:
          type: string
          description: What the operator wrote when they suspended, and what the
            provider reads on their own dashboard. Absent unless `status` is
            `SUSPENDED` - a reinstated business stops carrying the accusation.

    ModeratedProviderPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ModeratedProviderView'
        next_cursor:
          type: string
          nullable: true
          description: Opaque; null on the last page.

    ServicePhotoView:
      type: object
      required: [photo_id, url, position]
      properties:
        photo_id:
          type: string
          format: uuid
        url:
          type: string
          description: Where the bytes are. The name discloses neither the
            provider nor the original file.
        position:
          type: integer
          format: int32
          description: Zero first. The first photograph represents the service
            in a list, which is why it is worth being able to choose it.

    ServicePhotoList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ServicePhotoView'

    ReadinessView:
      type: object
      required: [has_service, has_hours, has_bookable_staff, can_publish, published]
      properties:
        has_service:
          type: boolean
          description: A service a customer can choose. The empty catalogue is
            what a salon is most likely to have forgotten.
        has_hours:
          type: boolean
          description: The week, without which the diary can offer nothing.
        has_bookable_staff:
          type: boolean
          description: Somebody a customer can be given. A solo barber has this
            from the moment they register, so it fails only after everybody was
            stood down.
        can_publish:
          type: boolean
          description: All three. What the publish gate will answer.
        published:
          type: boolean
          description: Whether the page is already live.

    ServiceAddress:
      type: object
      description: |
        Where the provider is going.

        Three fields and no coordinates, on purpose. A latitude and longitude -
        or a Plus Code, which is the same thing with the decimal point moved -
        is a surveillance-grade fact about a private home, and nothing in this
        product reads one: there is no map, no routing and no dispatch. It would
        be a liability stored for a feature that does not exist.

        What is here is what a tradesman actually asks on the phone: which
        commune, which quartier, and how to find the door. A customer who wants
        to paste a Plus Code into `directions` should - it is exactly the useful
        thing to paste in a city with few street addresses - and it is kept as
        the words they wrote, never parsed into a geometry.

        Accepted on a booking and returned on the PROVIDER's agenda only. It is
        deliberately absent from `CustomerBookingView`, which is reached by a
        reference rather than by a login: the customer already knows where they
        live, and a leaked reference should not also hand out a home address.
      required: [directions]
      properties:
        locality_slug:
          type: string
          maxLength: 80
          description: |
            One of the slugs `listLocalities` publishes. Optional even here: a
            customer who says "Nongo, behind the mosque" has told the plumber
            everything he needs, and refusing the booking because they did not
            also pick a commune from a list would lose the booking.
        area:
          type: string
          maxLength: 80
          description: The quartier, in the customer's own words.
        directions:
          type: string
          minLength: 1
          maxLength: 500
          description: |
            How to find the door. The one required field, because it is the one
            that actually gets the tradesman there - "derriere la mosquee de
            Nongo, portail bleu".

    BookAppointmentRequest:
      type: object
      description: |
        No provider identifier: the tenant comes from the slug in the path. No
        end time, no duration and no price: all three follow from the offering
        and are recomputed server-side, because a client-supplied price is the
        oldest trick there is.
      required: [service_offering_id, starts_at, customer]
      properties:
        service_offering_id:
          type: string
          format: uuid
        staff_id:
          type: string
          format: uuid
          description: Ask for one person. Omit - never send null - to let the
            server choose an available one.
        starts_at:
          type: string
          format: date-time
          description: The requested start, as a UTC instant.
        customer:
          $ref: '#/components/schemas/CustomerContact'
        fulfilment:
          allOf:
            - $ref: '#/components/schemas/Fulfilment'
          description: |
            Which of the service's published `fulfilments` the customer chose.
            The choice is FROZEN onto the appointment and is not re-derived from
            the offering afterwards: a braider who stops travelling must not turn
            Thursday's house call into a chair in her salon.

            OMIT IT when the service publishes exactly one mode - the server
            takes that one, which is what every request sent before this field
            existed means and why it is not required. When the service publishes
            several, omitting it is `400 VALIDATION_FAILED`: there is no
            defensible default between sitting in a salon and having somebody
            come to your house, and picking one would send a stranger to an
            address or leave a customer waiting at home.

            A value the service does not publish is `400 VALIDATION_FAILED` for
            the same reason a wrong `service_offering_id` is - it names
            something that is not on offer.

            It does not change the price or the duration. Both are frozen from
            the offering, which carries one of each whichever mode is chosen.
        service_address:
          allOf:
            - $ref: '#/components/schemas/ServiceAddress'
          description: |
            Where to come. Required when the chosen `fulfilment` is
            `AT_CUSTOMER`, refused otherwise - an appointment that happens at
            the shop must not carry somebody's home address, and a call-out with
            no directions is a job nobody can do.

            "The chosen one", not "the offering's": a service that publishes
            both `ON_SITE` and `AT_CUSTOMER` needs an address for one booking
            and must not hold one for the next.
        customer_note:
          type: string
          maxLength: 500

    CurrentMemberView:
      type: object
      description: |
        The signed-in person, as their own business knows them. No provider
        identifier: the tenant is ambient, and publishing the row key of the
        business would put in a response what no request is allowed to carry.
      required: [staff_id, display_name, role, bookable]
      properties:
        staff_id:
          type: string
          format: uuid
          description: |
            The caller's own chair. What every schedule operation asks for.
        display_name:
          type: string
        role:
          type: string
          description: |
            `OWNER` may change the team, the profile, the catalogue and the
            booking policy; `STAFF` may read them and run their own diary. The
            client uses it to hide what the server would refuse anyway - the
            check is on the server, this is only so the refusal is not the
            first the person hears of it.
          enum: [OWNER, STAFF]
        bookable:
          type: boolean
          description: Whether customers may pick this person on the public page.

    StaffView:
      type: object
      required: [staff_id, display_name, role, bookable, active]
      properties:
        staff_id:
          type: string
          format: uuid
        display_name:
          type: string
        role:
          type: string
        bookable:
          type: boolean
        active:
          type: boolean

    StaffList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StaffView'

    OpeningHoursSegment:
      type: object
      description: One stretch of a day, in the provider's own local time.
      required: [day_of_week, start_time, end_time]
      properties:
        day_of_week:
          type: integer
          format: int32
          minimum: 1
          maximum: 7
          description: ISO numbering, 1 is Monday.
        start_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: "08:00"
        end_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: "20:00"
        effective_from:
          type: string
          format: date
          description: Omit for hours that have always applied.
        effective_to:
          type: string
          format: date

    OpeningHours:
      type: object
      required: [staff_id, timezone, data]
      properties:
        staff_id:
          type: string
          format: uuid
        timezone:
          type: string
          description: The IANA zone the times are written in. A local time
            without one is not a moment.
          example: Africa/Conakry
        data:
          type: array
          items:
            $ref: '#/components/schemas/OpeningHoursSegment'

    OpeningHoursRequest:
      type: object
      required: [staff_id, data]
      properties:
        staff_id:
          type: string
          format: uuid
        data:
          type: array
          items:
            $ref: '#/components/schemas/OpeningHoursSegment'

    ClosureKind:
      type: string
      description: |
        `CLOSED` takes the whole day away. `CUSTOM_HOURS` replaces the day's
        weekly rules with the window given. `TIME_OFF` keeps the weekly rules
        and takes one window out of them - a dentist appointment on a Thursday
        afternoon, which was previously inexpressible: the only way to say it
        was to close the whole day or to restate the whole day by hand.

        Several entries may share one date. Every `CUSTOM_HOURS` window on a
        date is open, every `TIME_OFF` window on it is not, and one `CLOSED`
        entry overrides them all.
      enum: [CLOSED, CUSTOM_HOURS, TIME_OFF]

    ClosureRequest:
      type: object
      required: [staff_id, date, kind]
      properties:
        staff_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        kind:
          $ref: '#/components/schemas/ClosureKind'
        start_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Required for CUSTOM_HOURS and TIME_OFF, refused for
            CLOSED.
        end_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        reason:
          type: string
          maxLength: 200

    ClosureView:
      type: object
      required: [closure_id, staff_id, date, kind]
      properties:
        closure_id:
          type: string
          format: uuid
        staff_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        kind:
          $ref: '#/components/schemas/ClosureKind'
        start_time:
          type: string
        end_time:
          type: string
        reason:
          type: string

    ClosureList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClosureView'

    ServiceOfferingRequest:
      type: object
      description: |
        No provider identifier: the tenant comes from the token. The duration is
        what the appointment will occupy, and the buffers are the quiet either
        side of it - a cleaning slot, a chair to be swept.
      required: [name, duration_minutes, price]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
        duration_minutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 720
          description: Never zero. A zero-length service occupies an empty range,
            and an empty range collides with nothing.
        buffer_before_minutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 240
          default: 0
        buffer_after_minutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 240
          default: 0
        fulfilments:
          type: array
          # NOT minItems. The property is optional - the deprecated `location`
          # path this document still promises omits it - and jaxrs-spec
          # initialises an absent array to an empty list, then puts
          # @Size(min=1) on the getter. An omitted array would therefore be
          # refused by bean validation before any handler ran, and every
          # existing caller would answer 400. Proved, not reasoned.
          #
          # "At least one" is enforced where it belongs and twice:
          # ck_service_offerings_offers_one in the schema, and
          # OfferingDefinition's compact constructor.
          maxItems: 3
          items:
            $ref: '#/components/schemas/Fulfilment'
          description: |
            Every way this one service can be obtained. At least one, each value
            at most once, order ignored.

            `turnaround_hours` is required when this contains `DROP_OFF` and
            refused when it does not: the delay is the promise attached to that
            mode, and a service that also does `ON_SITE` carries no promise for
            the customer who stayed in the chair.

            ONE PRICE AND ONE DURATION, whichever mode the customer picks. A
            surcharge for travelling to somebody's house is a pricing model
            nobody has decided, and putting one here would change what a
            customer is charged after they have read a number on the page. A
            provider who genuinely charges more to travel still publishes two
            services - which is the same answer as before, now applied only to
            the case that actually differs.

            Omit it only to keep using the deprecated `location` below. Sending
            both is refused.
        turnaround_hours:
          type: integer
          format: int32
          minimum: 1
          maximum: 2160
          description: |
            The workshop delay, for a service the customer HANDS OVER rather
            than waits for: a garage, a phone repairer, an alteration.

            Required with `DROP_OFF` in `fulfilments`, refused without it. When
            the request uses the deprecated `location` instead, its presence is
            what makes the offering a drop-off, and it stays exclusive with
            `location: AT_CUSTOMER`.
        location:
          deprecated: true
          allOf:
            - $ref: '#/components/schemas/ServiceLocation'
          description: |
            Superseded by `fulfilments`, and refused alongside it - two fields
            for one fact are two fields that disagree.

            It could name only one shape, so a braider who works in her salon
            and at her customers' houses had to publish the same service twice.
            Read as a set of one: absent or `AT_PROVIDER` with no
            `turnaround_hours` is `[ON_SITE]`, absent or `AT_PROVIDER` with one
            is `[DROP_OFF]`, and `AT_CUSTOMER` is `[AT_CUSTOMER]`.
        price:
          $ref: '#/components/schemas/Money'
        price_visible:
          type: boolean
          default: true
          description: Whether the public page shows the price.
        sort_order:
          type: integer
          format: int32
          default: 0
        active:
          type: boolean
          default: true

    ServiceOfferingView:
      type: object
      required: [service_offering_id, name, duration_minutes, buffer_before_minutes,
                 buffer_after_minutes, price, price_visible, sort_order, active,
                 fulfilment]
      properties:
        service_offering_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        duration_minutes:
          type: integer
          format: int32
        buffer_before_minutes:
          type: integer
          format: int32
        buffer_after_minutes:
          type: integer
          format: int32
        turnaround_hours:
          type: integer
          format: int32
          description: Present exactly when `fulfilments` contains `DROP_OFF`.
        fulfilments:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/Fulfilment'
          description: Every way this service can be obtained. At least one.
        fulfilment:
          deprecated: true
          allOf:
            - $ref: '#/components/schemas/Fulfilment'
          description: |
            Superseded by `fulfilments`. Kept because it is published and
            required, and it now answers a question a single value cannot: for a
            service offering several modes it is the first of `ON_SITE`,
            `DROP_OFF`, `AT_CUSTOMER` that the service publishes, which is not
            the same thing as what the service is.
        price:
          $ref: '#/components/schemas/Money'
        price_visible:
          type: boolean
        sort_order:
          type: integer
          format: int32
        active:
          type: boolean

    Fulfilment:
      type: string
      description: |
        How the work reaches the customer.

        `ON_SITE`: the customer sits down and waits, and `duration_minutes` is
        how long.
        `DROP_OFF`: they hand the work over and come back, `duration_minutes`
        is the handover at the counter, and `turnaround_hours` is what was
        promised.
        `AT_CUSTOMER`: the provider travels, and the appointment carries the
        address. `duration_minutes` is the visit.

        These were mutually exclusive and are no longer. A service may publish
        SEVERAL of them - braids in the salon or at your house is one service,
        one price and one duration, and making a provider list it twice gave the
        catalogue two rows to keep in step and a customer two entries to choose
        between for no reason. See `fulfilments` on the offering schemas for the
        set, and `fulfilment` on `BookAppointmentRequest` for the customer's
        choice among them.

        The set is unordered. Where one value has to stand for a service that
        offers more than one - the deprecated singular `fulfilment` on the
        views - it is the first of `ON_SITE`, `DROP_OFF`, `AT_CUSTOMER` that the
        service publishes.

        A client that does not know a value should treat it as `ON_SITE`, which
        is what every service created before this enum grew actually is.
      enum: [ON_SITE, DROP_OFF, AT_CUSTOMER]

    ServiceLocation:
      type: string
      description: |
        Where the work happens, as a provider declares it.

        Deliberately not a third "either" value. "Either" is unanswerable at
        booking time - the form would not know whether to ask for an address,
        and the customer would not know whether to give one. A provider who
        genuinely does both publishes two services, which is also what they
        charge differently for.
      enum: [AT_PROVIDER, AT_CUSTOMER]
      default: AT_PROVIDER

    ServiceOfferingPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ServiceOfferingView'
        next_cursor:
          type: string
          nullable: true

    AppointmentStatus:
      type: string
      description: Where an appointment is in its life. Closed and named, so a
        client can switch on it.
      enum: [PENDING, CONFIRMED, CANCELLED, COMPLETED, NO_SHOW]

    Money:
      type: object
      description: Never a bare number and never a float. The scale is the
        currency's own - GNF has none, so 150000 is 150000 francs.
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
          format: int64
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: GNF

    AppointmentCustomerView:
      type: object
      description: |
        What the provider sees of the person who booked. This is their own
        address book, so the number is theirs to have - it appears in no public
        projection and in no notification payload.
      required: [full_name, phone]
      properties:
        full_name:
          type: string
        phone:
          type: string
          description: E.164.

    AppointmentView:
      type: object
      description: |
        One row of the caller's agenda. A separate schema from the public
        projection rather than the same one with fields stripped at runtime: a
        projection enforced by shape cannot be leaked by a forgotten condition.

        The service name and price are what was frozen at booking, not what the
        offering says today - repricing a service must not rewrite what a
        customer was quoted.
      required: [appointment_id, starts_at, ends_at, status, service_name, price,
                 customer, staff_id, staff_name]
      properties:
        appointment_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        service_name:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        customer:
          $ref: '#/components/schemas/AppointmentCustomerView'
        staff_id:
          type: string
          format: uuid
          description: Whose chair this appointment occupies. Never null - the
            server resolves one at booking even when the customer named nobody.
        staff_name:
          type: string
        customer_note:
          type: string
          description: What the customer wrote when booking. Published here
            because this is the only screen it was ever for - it was accepted
            by the booking request and discarded, so the box said "Message for
            the salon" and the message went nowhere.
        fulfilment:
          allOf:
            - $ref: '#/components/schemas/Fulfilment'
          description: |
            How this booking is being fulfilled, as the customer chose it and as
            it was frozen. It can no longer be inferred from the presence of
            `ready_by` or `service_address`, because the service it was booked
            from may publish all three modes and this appointment is only one of
            them.
        ready_by:
          type: string
          format: date-time
          description: |
            What was promised, on a drop-off. Absent on an on-site
            appointment - the customer never left. Movable: "the machine broke,
            it will be Friday" is the most frequent event of these trades.
        ready_at:
          type: string
          format: date-time
          description: When the work was actually declared ready. Absent until
            it is.
        service_address:
          allOf:
            - $ref: '#/components/schemas/ServiceAddress'
          description: |
            Where to go, on a call-out. Absent on every appointment that happens
            at the shop - which is not the same as an empty object, and is why
            it is absent rather than blank.

    AppointmentPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AppointmentView'
        next_cursor:
          type: string
          nullable: true
          description: Opaque; null on the last page.

    RescheduleAppointmentRequest:
      type: object
      description: |
        The new start, and nothing else about time. No end and no duration: both
        follow from the service the appointment already carries, and accepting
        either would let a caller shrink its own footprint and move inside
        someone else's appointment.
      required: [starts_at]
      properties:
        starts_at:
          type: string
          format: date-time
        staff_id:
          type: string
          format: uuid
          description: |
            Move the appointment to another colleague's chair. Omit - never
            send null - to leave it where it is, which is what a pure time
            move does.

            A move between chairs at the same time is a legitimate request and
            not a no-op: the exclusion constraint keys on the staff member, so
            the appointment is being taken off one resource and put onto
            another.

    ReadyByRequest:
      type: object
      description: The new promise, and nothing else about the appointment.
      required: [ready_by]
      properties:
        ready_by:
          type: string
          format: date-time
          description: A UTC instant. It may not precede the end of the
            handover.

    RescheduleBookingRequest:
      type: object
      description: |
        A start, and nothing else about time. The end and the block window are
        recomputed from the service the appointment already carries - accepting
        an end or a duration would let a client shrink its own footprint and
        move inside somebody else's appointment.
      required: [starts_at]
      properties:
        starts_at:
          type: string
          format: date-time
          description: The new start, as a UTC instant.

    CancelAppointmentRequest:
      type: object
      description: What the provider wants recorded about why. Private to them -
        it appears in no customer-facing message.
      properties:
        reason:
          type: string
          maxLength: 200

    CustomerBookingView:
      type: object
      description: |
        What the customer is shown. No appointment identifier, no staff
        identifier, no customer identifier: the reference is the only handle, and
        publishing a second one would be publishing a second way in.
      required: [reference, provider_slug, provider_name, service_name,
                 staff_name, starts_at, ends_at, status, price, timezone]
      properties:
        reference:
          type: string
        provider_slug:
          type: string
        provider_name:
          type: string
        service_name:
          type: string
        fulfilment:
          allOf:
            - $ref: '#/components/schemas/Fulfilment'
          description: |
            What the customer chose when they booked, frozen. The one field on
            this view that says whether to go to the salon, drop something off,
            or wait at home - and since a service may now publish all three, it
            cannot be worked out from the service name.
        timezone:
          type: string
          description: |
            The provider's own IANA zone. The instants above are UTC, and a
            customer reading "14:00" wants the time at the salon, not the time
            where their phone happens to be - so the one thing that turns the
            instant into that reading travels with it, rather than being
            fetched from the provider's page or guessed from the browser.
          example: Africa/Conakry
        staff_name:
          type: string
          description: Who they booked with. They chose or were told; it is not
            a disclosure.
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        price:
          $ref: '#/components/schemas/Money'
        ready_by:
          type: string
          format: date-time
          description: When the provider promised it would be ready. Absent
            unless this was a drop-off.
        ready_at:
          type: string
          format: date-time
          description: When it was declared ready. This is the field that turns
            "come back Friday" into "it is waiting for you".
        cancellable_until:
          type: string
          format: date-time
          description: |
            Absent when it can no longer be called off online at all - the
            deadline has passed, or it is already cancelled or over. Absent
            rather than a date in the past, so a client does not offer a button
            that answers 422.

    AppointmentCreatedView:
      type: object
      description: |
        Deliberately thin, and the `reference` is the reason it is not thinner.
        The identifier was all the public path handed back, and it left the
        customer with no way to return: the reference is what `getBooking` and
        `cancelBooking` take, and it travels on in the confirmation message.

        `status` is here because the answer differs by provider and the customer
        has to be told which. `PENDING` means the request is with the salon;
        `CONFIRMED` means it is already expecting you.
      required: [appointment_id, reference, status]
      properties:
        appointment_id:
          type: string
          format: uuid
        reference:
          type: string
          description: |
            Keep it. It is the only way back to this appointment without an
            account, and it is returned once.

            Canonical `AAA-BBBBBB`, ten characters, and it is meant to be read
            aloud and written down. Upper case throughout, deliberately: the
            previous format was mixed-case base64url, the page rendered it
            inside an element carrying `text-transform: uppercase`, and what
            every customer copied off the screen was therefore not their
            reference. A format a stylesheet cannot damage was the fix, rather
            than a rule about which element it may be put in.
        status:
          $ref: '#/components/schemas/AppointmentStatus'

    RegisterProviderRequest:
      type: object
      description: |
        No provider identifier, and no account fields: who the caller is comes
        from the verified token. What is here is what only the business knows.
      required: [slug, business_name]
      properties:
        slug:
          type: string
          description: |
            The public handle - the string on the QR code and in the WhatsApp
            message. Chosen once and permanent; `updateProviderProfile` cannot
            change it.
          pattern: '^[a-z0-9]([a-z0-9-]{1,58}[a-z0-9])$'
          minLength: 3
          maxLength: 60
          example: salon-awa
        business_name:
          type: string
          minLength: 1
          maxLength: 120
        category_slug:
          type: string
          description: One of the published categories. Omit if none fits.
          maxLength: 60
          example: coiffure
        city:
          type: string
          maxLength: 80
        timezone:
          type: string
          description: |
            The IANA zone the opening hours will be written in. Defaults to
            `Africa/Conakry`. Defaulted, never assumed - the product is not
            Guinea-only.
          maxLength: 64
          example: Africa/Conakry

    ProviderRegisteredView:
      type: object
      required: [provider_id, slug, published]
      properties:
        provider_id:
          type: string
          format: uuid
          description: |
            The caller's own tenant. Returned once, here, because a client that
            has just created something is entitled to know what it created; it
            is never accepted back as a request field.
        slug:
          type: string
        published:
          type: boolean
          description: Always false. A business is created dormant.

    ProviderProfileView:
      type: object
      required: [slug, business_name, timezone, published, status]
      properties:
        slug:
          type: string
        business_name:
          type: string
        description:
          type: string
        category_slug:
          type: string
        locality:
          $ref: '#/components/schemas/LocalityRef'
        area:
          type: string
        city:
          type: string
          deprecated: true
        address_line:
          type: string
        public_phone_e164:
          type: string
        public_email:
          type: string
        whatsapp_phone_e164:
          type: string
        logo_url:
          type: string
          description: Absent until one is uploaded. Set through
            `replaceProviderLogo`, never through this profile.
        cover_url:
          type: string
        timezone:
          type: string
        published:
          type: boolean
        status:
          $ref: '#/components/schemas/ProviderStatus'
        public_url:
          type: string
          description: |
            Where a customer reaches this business. The link to put in a
            WhatsApp status, and what the QR code encodes.

            Built from the slug, which is why the slug is read-only: it is
            printed on every card already handed out.
          example: https://balaaca.com/p/salon-fatou
        suspended_at:
          type: string
          format: date-time
          description: Absent unless the platform has suspended this business.
        suspension_reason:
          type: string
          description: |
            Why, in the operator's own words. Published to the provider on
            purpose: a business whose page has vanished must be able to read the
            reason here, rather than discovering it because customers stopped
            arriving.

    ProviderStatus:
      type: string
      description: |
        Where the business stands with the platform, which is not the same
        question as whether its page is live. A `SUSPENDED` provider keeps
        `published: true` and still disappears from the public path.

        Two values, and both are reachable - which is new. It carried four:
        `PENDING`, `ACTIVE`, `SUSPENDED`, `CLOSED`, with a default of `PENDING`
        and no code anywhere that wrote the column, so every business was
        pending for ever and the other three were unreachable. `PENDING` meant
        "waiting to be let in" and nobody vets a business here; `CLOSED` meant
        "shut down", which `published: false` already says, is already writable
        by the provider, and already hides the page. Both are gone rather than
        left as states nothing can produce.
      enum: [ACTIVE, SUSPENDED]

    ProviderProfileRequest:
      type: object
      description: The whole profile. No slug - see `updateProviderProfile`.
      required: [business_name, timezone, published]
      properties:
        business_name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        category_slug:
          type: string
          maxLength: 60
        locality_slug:
          type: string
          maxLength: 80
          description: |
            One of the slugs `listLocalities` publishes - a commune of Conakry,
            or a prefecture elsewhere. A slug that map does not hold is
            refused rather than stored, because a filter nobody can select is
            worse than an empty field.

            Omit it to clear the field. Supersedes `city`.
        area:
          type: string
          maxLength: 80
          description: |
            The quartier, in the provider's own words - "Nongo", "Kipe", "Dixinn
            Port". Free text, deliberately: Guinea's quartiers are thousands of
            rows this platform does not author, and a curated list would be
            missing exactly the one this provider lives in. `listAreas` offers
            what has already been written, which is what keeps the values from
            fragmenting.
        city:
          type: string
          maxLength: 80
          deprecated: true
          description: Superseded by `locality_slug` and `area`.
        address_line:
          type: string
          maxLength: 200
        public_phone_e164:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
          example: "+224622000001"
        public_email:
          type: string
          maxLength: 200
        whatsapp_phone_e164:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        timezone:
          type: string
          maxLength: 64
        published:
          type: boolean

    PublicServiceOffering:
      type: object
      description: |
        A service as a customer sees it. The buffers padding each appointment
        are internal and absent, and `price` is absent - not null, not zero -
        when the provider chose not to publish it.
      required: [service_offering_id, name, duration_minutes, fulfilment]
      properties:
        service_offering_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        duration_minutes:
          type: integer
          format: int32
          description: |
            On an `ON_SITE` offering, how long the customer is there. On a
            `DROP_OFF` one, how long the handover takes - a page that showed it
            as the length of the work would tell somebody a repair takes ten
            minutes. On an `AT_CUSTOMER` one, how long the visit is expected to
            take.
        turnaround_hours:
          type: integer
          format: int32
          description: Present exactly when `fulfilments` contains `DROP_OFF`.
            "Ready in 48 h" is what a customer needs before choosing, which is
            why it is published.
        fulfilments:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/Fulfilment'
          description: |
            Every way this service can be obtained, and therefore exactly what
            the booking form must offer the customer as a choice. One value
            means no choice to make and nothing to ask; more than one means the
            form asks, and `fulfilment` on the booking request carries the
            answer.

            The price and the duration above apply to all of them.
        fulfilment:
          deprecated: true
          allOf:
            - $ref: '#/components/schemas/Fulfilment'
          description: |
            Superseded by `fulfilments`. For a service publishing several modes
            this is the first of `ON_SITE`, `DROP_OFF`, `AT_CUSTOMER` among
            them, so a client that branches on it will draw one of the ways this
            service can be had and hide the others.
        photos:
          type: array
          maxItems: 5
          items:
            type: string
          description: |
            What the service looks like, in the provider's own order and at most
            five. The first is the one to show wherever there is room for one.

            In braiding, in nails, in decoration, in catering, this is the
            specification rather than decoration: a customer cannot tell two
            kinds of braids apart from their names.
        price:
          $ref: '#/components/schemas/Money'

    PublicProviderView:
      type: object
      description: |
        A separate projection, not the dashboard view with fields filtered at
        runtime: a shape cannot be leaked by a forgotten condition.
      required: [slug, business_name, timezone, services]
      properties:
        slug:
          type: string
        business_name:
          type: string
        description:
          type: string
        category_slug:
          type: string
        city:
          type: string
          deprecated: true
          description: Superseded by `locality` and `area`.
        locality:
          allOf:
            - $ref: '#/components/schemas/LocalityRef'
          description: The commune or prefecture, from the published map.
        area:
          type: string
          description: The quartier, in the provider's own words.
        address_line:
          type: string
        logo_url:
          type: string
        cover_url:
          type: string
        public_phone_e164:
          type: string
        whatsapp_phone_e164:
          type: string
        timezone:
          type: string
          description: The zone the opening hours are written in.
        services:
          type: array
          description: Active services, in the provider's own order.
          items:
            $ref: '#/components/schemas/PublicServiceOffering'

    PublicOpeningHoursSegment:
      type: object
      description: One stretch of a day, in the provider's own local time.
      required: [day_of_week, start_time, end_time]
      properties:
        day_of_week:
          type: integer
          format: int32
          minimum: 1
          maximum: 7
          description: ISO numbering, 1 is Monday.
        start_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: "08:00"
        end_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: "20:00"

    PublicOpeningHours:
      type: object
      required: [timezone, data]
      properties:
        timezone:
          type: string
          description: The IANA zone the times are written in. A local time
            without one is not a moment.
          example: Africa/Conakry
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublicOpeningHoursSegment'

    LocalityList:
      type: object
      description: |
        No cursor. Fifty-one rows is one page and always will be - the map of a
        country does not paginate, and inventing one would make every client
        walk a loop that runs once.
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LocalityView'

    LocalityView:
      type: object
      required: [slug, label_fr, kind, provider_count]
      properties:
        slug:
          type: string
          description: What `listProviders` accepts. Stable, never renamed.
        label_fr:
          type: string
        kind:
          type: string
          enum: [REGION, PREFECTURE, COMMUNE]
        parent_slug:
          type: string
          description: Absent on a region, which is a root.
        iso_3166_2:
          type: string
          description: |
            The ISO 3166-2 subdivision code, on the eight regions.

            Absent on a prefecture and on a commune, and for two different
            reasons. The standard publishes nothing below a prefecture at all -
            which is exactly why the code is an attribute here and not the
            search key. It DOES publish one for each prefecture, and this
            repository has not written them: guessing thirty-three two-letter
            codes to fill a column nothing reads yet would be inventing data
            that looks authoritative. They can be added by an update the day
            something needs them.
        provider_count:
          type: integer
          format: int32
          description: |
            How many providers `listProviders` returns for this slug. The
            number a place tile shows, and the reason it is here: a tile that
            says 8 has to lead to 8 results.

            So it is counted DOWN THE TREE, exactly as the `locality` filter
            matches. A commune counts the businesses filed against it; a
            prefecture counts its own plus every commune beneath it; a region
            counts everything under it. Conakry is the sum of its ten communes
            rather than zero, even though almost nobody files a business
            against the region itself.

            The alternative - counting only rows filed at exactly this level -
            was rejected because it makes every level above the commune read as
            empty while the filter behind it returns dozens, which is the
            number contradicting the list it labels.

            The consequence, and a client must not get it wrong: THESE DO NOT
            SUM. A region already contains its prefectures and a prefecture its
            communes, so adding the column up counts one business as many as
            three times. This is not a breakdown of a total and there is no
            total of the country here.

            Counted over published, active providers, which is the same set
            every public operation can see. A business that has not published,
            or that the platform has suspended, is in nobody's tile.

    AreaList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AreaView'

    AreaView:
      type: object
      required: [label, provider_count]
      properties:
        label:
          type: string
          description: As the providers wrote it. The most common spelling wins
            when several exist, which is what makes the suggestion converge.
        provider_count:
          type: integer
          format: int32

    ProviderSummary:
      type: object
      description: |
        Enough to draw a card and decide whether to open the page, and nothing
        more. Not PublicProviderView with fields removed: a list of every
        provider is a far easier thing to scrape than one page at a time, so
        what it carries is chosen once and stays small. No contact details in
        particular - a directory that hands out every provider's phone number
        in one request is a marketing list.
      required: [slug, business_name]
      properties:
        slug:
          type: string
        business_name:
          type: string
        description:
          type: string
        category_slug:
          type: string
        city:
          type: string
          deprecated: true
          description: Superseded by `locality` and `area`.
        locality:
          $ref: '#/components/schemas/LocalityRef'
        area:
          type: string
          description: The quartier, as the provider wrote it.
        logo_url:
          type: string
        fulfilments:
          type: array
          items:
            $ref: '#/components/schemas/Fulfilment'
          description: |
            Every way this business can be reached, as a set, DERIVED from the
            modes its currently ACTIVE service offerings publish. Not a field
            the provider fills in: a business that offers house calls says so by
            publishing a service that does, and stops saying so by retiring it.

            Unordered, and each value appears once. It may be EMPTY - a business
            with no active service publishes nothing to aggregate, and that is a
            real state a directory card has to draw. Treat empty as "not stated"
            rather than as "none", and show nothing rather than a badge saying
            so.
        price_from:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
          description: |
            The lowest price among the same active offerings, counting only
            those whose price the provider chose to publish. DERIVED, like
            `fulfilments`, and `null` whenever there is nothing to derive it
            from - no active service, or none with a visible price. Null and
            zero are different answers and a client must not render one as the
            other.

            It is a floor and it is presented as one - "dès 90 000 GNF". It is
            not what this customer will pay, because what they pay depends on
            the service they pick, and a card that showed it as a price would be
            quoting a number nobody agreed to.

    LocalityRef:
      type: object
      description: Where a business is, at the finest level the published map
        has - a commune in Conakry, a prefecture elsewhere.
      required: [slug, label_fr]
      properties:
        slug:
          type: string
        label_fr:
          type: string

    ProviderSummaryPage:
      type: object
      required: [data, next_cursor, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProviderSummary'
        next_cursor:
          type: string
          nullable: true
          description: Opaque; null on the last page.
        total:
          type: integer
          format: int32
          description: |
            How many providers match, across every page - what a toolbar means
            by "23 professionnels" rather than "6 sur cette page".

            It counts the same filters the page does and IGNORES the cursor, so
            it is the size of the answer and not what is left of it. Paging
            forward does not make it shrink.

            EXACT, never capped or rounded. That is a cost and a deliberate
            one: it is a second aggregate over the matching set on every page,
            where `next_cursor` costs only the one extra row the page already
            reads. A capped total makes every client render one number two ways
            and turns "23" into a promise nobody checks; the directory of one
            country is not large enough to be worth that. The day it is, cap it
            and publish the ceiling beside it rather than letting the number
            quietly stop being true.

    StaffRequest:
      type: object
      description: |
        No role and no account. Ownership is not an edit, and a member is a
        bookable resource rather than a login.
      required: [display_name, bookable, active]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        bookable:
          type: boolean
          description: Whether a customer may be given this person's slots. A
            receptionist is active and not bookable.
        active:
          type: boolean
          description: False for someone who has left. Their appointments stay.

    PublicStaffMember:
      type: object
      description: |
        A separate projection from StaffView, which carries the role and whether
        the person is active. Neither is a customer's business, and a shape that
        does not hold them cannot leak them.
      required: [staff_id, display_name]
      properties:
        staff_id:
          type: string
          format: uuid
          description: Pass to bookAppointment or listAvailableSlots to ask for
            this person in particular.
        display_name:
          type: string

    PublicStaffList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublicStaffMember'

    StaffInvitationView:
      type: object
      description: |
        Returned once and stored nowhere the owner can read it again. Issuing a
        second code replaces this one, which is also how it is revoked.
      required: [code, expires_at]
      properties:
        code:
          type: string
          description: Hand it to the person it is for. It grants exactly one
            thing - a seat at this provider - and nothing else.
        expires_at:
          type: string
          format: date-time

    JoinedProviderView:
      type: object
      required: [provider_slug, business_name, display_name, role]
      properties:
        provider_slug:
          type: string
        business_name:
          type: string
        display_name:
          type: string
          description: The name the owner gave this chair, not one the caller
            chose. They were invited to a seat that already existed.
        role:
          type: string
          enum: [STAFF]
          description: Always STAFF. An owner's row is not claimable by an
            invitation, in the function and in the policy behind it.

    CategoryView:
      type: object
      required: [slug, label_fr, provider_count]
      properties:
        slug:
          type: string
          description: What `listProviders` accepts. Stable, and never renamed.
        label_fr:
          type: string
        icon:
          type: string
          description: A name a client resolves in its own icon set, never a URL.
        family:
          $ref: '#/components/schemas/CategoryFamily'
        provider_count:
          type: integer
          format: int32
          description: |
            How many PUBLISHED providers hold this trade, counted exactly the
            way the directory counts - a suspended business is not in it.

            It exists so a client can show the trades that hold somebody and
            keep the rest behind "see all". That is what makes adding a trade
            cost nothing on the day it lands: it is invisible until the first
            provider registers under it, and appears by itself afterwards.

    CategoryFamily:
      type: object
      description: |
        The heading a client groups a trade under. Absent on one that belongs
        to none, which lands in a "Divers" bucket rather than nowhere.

        Eighteen trades fitted in one grid; thirty-five do not, and the
        alternative to a grouping is a client scrolling past thirty-four to
        reach theirs.
      required: [slug, label_fr]
      properties:
        slug:
          type: string
        label_fr:
          type: string
        icon:
          type: string

    CategoryList:
      type: object
      description: |
        No cursor. The whole taxonomy is a page and always will be - a hub with
        two hundred trades is a hub nobody can browse - and inventing pagination
        here would make every client walk a loop that always runs once.
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CategoryView'

    BookingPolicyRequest:
      type: object
      description: |
        The bounds match the database's own CHECK constraints, so a value this
        schema accepts is a value the row accepts. They are stated twice on
        purpose: the constraint is the guarantee, and this is the message.
      required: [slot_granularity_minutes, min_lead_time_minutes, max_advance_days,
                 cancellation_deadline_minutes, auto_confirm]
      properties:
        slot_granularity_minutes:
          type: integer
          format: int32
          minimum: 5
          maximum: 120
          description: The grid offered times fall on. Fifteen suits a salon;
            a photographer working in half-days does not want thirty-two
            starts before lunch.
        min_lead_time_minutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 20160
          description: How much notice you need. Zero means a customer standing
            at the counter can book the next slot.
        max_advance_days:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
          description: How far ahead the calendar is open.
        cancellation_deadline_minutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 20160
          description: How late a CUSTOMER may call it off online. It never
            binds you - cancelling your own appointment is managing your diary.
        auto_confirm:
          type: boolean
          description: True accepts a booking on arrival. False leaves it
            pending until you accept it, which sends the customer a second
            message.

    BookingPolicyView:
      type: object
      required: [slot_granularity_minutes, min_lead_time_minutes, max_advance_days,
                 cancellation_deadline_minutes, auto_confirm]
      properties:
        slot_granularity_minutes:
          type: integer
          format: int32
        min_lead_time_minutes:
          type: integer
          format: int32
        max_advance_days:
          type: integer
          format: int32
        cancellation_deadline_minutes:
          type: integer
          format: int32
        auto_confirm:
          type: boolean
